<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description"
        content="Documentación técnica de la API de QPayPro: checkout, pagos, 3D-Secure, tokenización, QpayFel y cobros automáticos.">
    <meta name="color-scheme" content="light dark">
    <title>QPayPro API · Documentación</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
    <style>
        /* =====================================================================
           Tokens
           ===================================================================== */
        :root {
            --bg: #f8f8f6;
            --surface: #ffffff;
            --surface-2: #f2f2ef;
            --surface-3: #e9e9e5;
            --border: #e5e5e0;
            --border-strong: #d4d4cd;
            --text: #1b1b20;
            --text-muted: #62626c;
            --text-subtle: #8b8b94;

            /* Índigo: combina con el color del logo de QPayPro. */
            --accent: #4338ca;
            --accent-hover: #3730a3;
            --accent-soft: #efeefc;
            --accent-soft-2: #e2dffb;
            --accent-text: #3730a3;

            /* Nombres que usan los estilos heredados de la consola y los bloques. */
            --brand: #4338ca;
            --brand-600: #3730a3;
            --accent-strong: #4338ca;

            --code-bg: #17171a;
            --code-text: #e4e4e7;
            --code-border: #26262b;

            --ok: #15803d;
            --ok-bg: #effbf3;
            --ok-border: #b7ebc6;
            --warn: #a55309;
            --warn-bg: #fff8eb;
            --warn-border: #f5d9a8;
            --info: #4338ca;
            --info-bg: #f1f0fd;
            --info-border: #d4d0f7;
            --delete: #b91c1c;
            --delete-bg: #fef2f2;

            --m-get: #2563eb;
            --m-post: #16a34a;
            --m-put: #d97706;
            --m-delete: #dc2626;

            --shadow-sm: 0 1px 2px rgba(20, 20, 30, .05);
            --shadow-lg: 0 18px 48px rgba(20, 20, 40, .16);
            --ring: 0 0 0 3px rgba(67, 56, 202, .22);

            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;

            --topbar-h: 54px;
            --sidebar-w: 236px;
        }

        html[data-theme="dark"] {
            --bg: #101013;
            --surface: #16161a;
            --surface-2: #1c1c21;
            --surface-3: #25252c;
            --border: #29292f;
            --border-strong: #37373f;
            --text: #ececf1;
            --text-muted: #a3a3ad;
            --text-subtle: #7d7d87;

            --accent: #8b84ff;
            --accent-hover: #a29dff;
            --accent-soft: #24223f;
            --accent-soft-2: #2e2b55;
            --accent-text: #b9b5ff;

            --brand: #5b52f0;
            --brand-600: #4c43e0;
            --accent-strong: #8b84ff;

            --code-bg: #0b0b0d;
            --code-text: #e4e4e7;
            --code-border: #222227;

            --ok: #4ade80;
            --ok-bg: #0f2a1a;
            --ok-border: #1f5a36;
            --warn: #f5b454;
            --warn-bg: #2a1d0a;
            --warn-border: #5e4214;
            --info: #b9b5ff;
            --info-bg: #1e1c36;
            --info-border: #3a3670;
            --delete: #f87171;
            --delete-bg: #2a1212;

            --shadow-lg: 0 18px 48px rgba(0, 0, 0, .55);
            --ring: 0 0 0 3px rgba(139, 132, 255, .3);
        }

        /* =====================================================================
           Base
           ===================================================================== */
        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font: 14.5px/1.6 var(--font);
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: var(--accent);
        }

        :focus-visible {
            outline: none;
            box-shadow: var(--ring);
            border-radius: 6px;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            margin: -1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
        }

        kbd {
            font-family: var(--font);
            font-size: 11px;
            color: var(--text-subtle);
            border: 1px solid var(--border);
            border-bottom-width: 2px;
            border-radius: 5px;
            padding: 0 5px;
            background: var(--surface);
        }

        code.ic {
            font-family: var(--mono);
            font-size: .87em;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1px 5px;
            white-space: nowrap;
        }

        /* =====================================================================
           Barra superior
           ===================================================================== */
        .topbar {
            position: relative;
            z-index: 30;
            height: var(--topbar-h);
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 16px;
            padding: 0 16px 0 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .top-left {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text);
            text-decoration: none;
            font-weight: 650;
            font-size: 15px;
            white-space: nowrap;
        }

        .brand .logo {
            height: 22px;
            width: auto;
        }

        html[data-theme="dark"] .brand .logo {
            background: #fff;
            padding: 3px 6px;
            border-radius: 6px;
            box-sizing: content-box;
        }

        .tabs {
            display: flex;
            gap: 26px;
        }

        .tab {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            white-space: nowrap;
        }

        .tab:hover {
            color: var(--text);
        }

        .tab[aria-current="page"] {
            color: var(--text);
            font-weight: 600;
        }

        .top-actions {
            justify-self: end;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .search-trigger {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 32px;
            min-width: 176px;
            padding: 0 7px 0 10px;
            margin-right: 6px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text-subtle);
            font: inherit;
            font-size: 13px;
            cursor: pointer;
        }

        .search-trigger:hover {
            border-color: var(--border-strong);
            color: var(--text-muted);
        }

        .search-trigger svg {
            width: 14px;
            height: 14px;
            flex: none;
        }

        .search-trigger kbd {
            margin-left: auto;
        }

        /* Selector de entorno: ocupa el lugar del selector de versión. */
        .env {
            position: relative;
            margin-right: 4px;
        }

        .env select {
            appearance: none;
            -webkit-appearance: none;
            height: 30px;
            padding: 0 26px 0 10px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--surface);
            color: var(--text-muted);
            font-family: var(--mono);
            font-size: 12.5px;
            cursor: pointer;
        }

        .env select:hover {
            border-color: var(--border-strong);
            color: var(--text);
        }

        .env::after {
            content: "";
            position: absolute;
            right: 10px;
            top: 50%;
            width: 0;
            height: 0;
            margin-top: -2px;
            border: 4px solid transparent;
            border-top-color: var(--text-subtle);
            border-bottom: 0;
            pointer-events: none;
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            display: inline-grid;
            place-items: center;
            flex: none;
            border: 0;
            border-radius: 7px;
            background: transparent;
            color: var(--text-subtle);
            cursor: pointer;
        }

        .icon-btn:hover {
            background: var(--surface-2);
            color: var(--text);
        }

        .icon-btn svg {
            width: 17px;
            height: 17px;
        }

        .menu-btn {
            display: none;
        }

        /* =====================================================================
           Estructura: barra lateral y contenido
           ===================================================================== */
        .shell {
            position: fixed;
            top: var(--topbar-h);
            right: 0;
            bottom: 0;
            left: 0;
            display: grid;
            /* Por encima de la barra superior (z 30): así el panel del asistente, que vive
               aquí dentro, puede cubrir la página entera. */
            z-index: 31;
            grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
        }

        .sidebar {
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: 22px 12px 48px;
            border-right: 1px solid var(--border);
            background: var(--bg);
        }

        .nav-label {
            margin: 22px 8px 6px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .09em;
            text-transform: uppercase;
            color: var(--text-subtle);
        }

        .nav-label:first-child {
            margin-top: 0;
        }

        .nav-link {
            display: block;
            padding: 4px 8px;
            margin: 1px 0;
            border-radius: 6px;
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.45;
            text-decoration: underline;
            text-decoration-color: var(--border-strong);
            text-underline-offset: 3px;
        }

        .nav-link:hover {
            color: var(--text);
            text-decoration-color: var(--text-subtle);
        }

        .nav-link[aria-current="page"] {
            background: var(--accent-soft);
            color: var(--accent-text);
            text-decoration-color: currentColor;
        }

        .main {
            overflow-y: auto;
            overscroll-behavior: contain;
        }

        .page {
            max-width: 780px;
            padding: 42px 44px 110px 34px;
        }

        /* =====================================================================
           Página
           ===================================================================== */
        .crumbs {
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .crumbs a {
            color: inherit;
            text-decoration: none;
        }

        .crumbs a:hover {
            color: var(--text);
            text-decoration: underline;
        }

        .crumbs .sep {
            margin: 0 5px;
            color: var(--text-subtle);
        }

        .title-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
        }

        .page h1 {
            margin: 0 0 14px;
            font-size: 27px;
            font-weight: 650;
            line-height: 1.25;
            letter-spacing: -.012em;
        }

        .lead {
            max-width: 66ch;
            margin: 0 0 24px;
            font-size: 15px;
            color: var(--text);
        }

        .ep-line {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .badge {
            display: inline-block;
            flex: none;
            padding: 2px 8px;
            border-radius: 5px;
            color: #fff;
            font-family: var(--mono);
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: .03em;
            line-height: 1.6;
        }

        .badge.GET {
            background: var(--m-get);
        }

        .badge.POST {
            background: var(--m-post);
        }

        .badge.PUT {
            background: var(--m-put);
        }

        .badge.DELETE {
            background: var(--m-delete);
        }

        .path {
            font-family: var(--mono);
            font-size: 14px;
            color: var(--text);
            overflow-wrap: anywhere;
        }

        .ep-host {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 18px;
            font-size: 12.5px;
            color: var(--text-muted);
        }

        .ep-host .host {
            font-family: var(--mono);
            overflow-wrap: anywhere;
        }

        .env-tag {
            padding: 0 7px;
            border-radius: 999px;
            border: 1px solid var(--border);
            font-size: 11.5px;
            color: var(--text-subtle);
            white-space: nowrap;
        }

        .mini-copy {
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-muted);
            border-radius: 6px;
            padding: 2px 8px;
            font: inherit;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        .mini-copy:hover {
            color: var(--text);
            border-color: var(--border-strong);
        }

        .mini-copy.copied {
            color: var(--ok);
            border-color: var(--ok-border);
        }

        .sub-label {
            margin: 30px 0 8px;
            font-size: 11.5px;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--text-subtle);
        }

        .console .sub-label {
            margin-top: 14px;
        }

        .block-title {
            margin: 32px 0 10px;
            font-size: 17px;
            font-weight: 600;
        }

        .doc-p {
            margin: 0 0 14px;
        }

        .doc-list {
            margin: 0 0 16px;
            padding-left: 22px;
        }

        /* Filas de parámetros y encabezados: nombre a la izquierda, tipo a la derecha. */
        .rows {
            border-top: 1px solid var(--border);
        }

        .row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 3px 16px;
            padding: 11px 0;
            border-bottom: 1px solid var(--border);
        }

        .row-name {
            font-family: var(--mono);
            font-size: 13.5px;
            color: var(--text);
            overflow-wrap: anywhere;
        }

        .row-meta {
            font-size: 12.5px;
            color: var(--text-subtle);
            text-align: right;
            white-space: nowrap;
        }

        .row-meta.req {
            color: var(--text-muted);
        }

        .row-meta.mono {
            font-family: var(--mono);
            white-space: normal;
        }

        .row-desc {
            grid-column: 1 / -1;
            font-size: 13.5px;
            color: var(--text-muted);
        }

        /* Lista de endpoints en la vista de una sección. */
        .ep-list {
            margin: 4px 0 24px;
            border-top: 1px solid var(--border);
        }

        .ep-row {
            display: grid;
            grid-template-columns: 62px minmax(0, 1fr) auto;
            align-items: center;
            gap: 12px;
            padding: 11px 8px;
            border-bottom: 1px solid var(--border);
            color: var(--text);
            text-decoration: none;
        }

        .ep-row:hover {
            background: var(--surface-2);
        }

        .ep-row .badge {
            justify-self: start;
            font-size: 10.5px;
        }

        .ep-row .name {
            font-weight: 500;
        }

        .ep-row .p {
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: var(--mono);
            font-size: 12px;
            color: var(--text-subtle);
        }

        /* Anterior / Siguiente */
        .pager {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 52px;
        }

        .pager a {
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
        }

        .pager a:hover {
            border-color: var(--border-strong);
        }

        .pager small {
            display: block;
            font-size: 12px;
            font-weight: 400;
            color: var(--text-subtle);
        }

        .pager .next {
            grid-column: 2;
            text-align: right;
        }

        /* =====================================================================
           Bloques de código (oscuros, como la solicitud de la referencia)
           ===================================================================== */
        .code-block {
            margin: 0 0 16px;
            overflow: hidden;
            border: 1px solid var(--code-border);
            border-radius: 10px;
            background: var(--code-bg);
        }

        .code-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 9px 10px 0 18px;
            color: #71717a;
            font-family: var(--mono);
            font-size: 12.5px;
        }

        .code-head::before {
            content: "// ";
            white-space: pre;
        }

        .request .code-head::before {
            content: none;
        }

        .code-block pre {
            margin: 0;
            max-height: 380px;
            overflow: auto;
            padding: 8px 18px 18px;
            color: var(--code-text);
            font: 13px/1.7 var(--mono);
        }

        .copy-btn {
            margin-left: auto;
            border: 1px solid #34343b;
            border-radius: 6px;
            background: transparent;
            color: #a1a1aa;
            padding: 2px 9px;
            font: 11.5px var(--font);
            cursor: pointer;
        }

        .copy-btn:hover {
            color: #fff;
            border-color: #52525b;
        }

        .copy-btn.copied {
            color: #4ade80;
            border-color: rgba(74, 222, 128, .4);
        }

        .code-tabs {
            display: flex;
            gap: 2px;
        }

        .code-tabs button {
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: #71717a;
            padding: 3px 9px;
            font: 12px var(--mono);
            cursor: pointer;
        }

        .code-tabs button[aria-selected="true"] {
            background: #26262b;
            color: #e4e4e7;
        }

        /* Coloreado: cadenas en ámbar y números en verde, como la referencia. */
        .c-com {
            color: #71717a;
        }

        .c-cmd {
            color: #fafafa;
        }

        .c-flag {
            color: #a1a1aa;
        }

        .c-str,
        .code-block .j-str {
            color: #fcd34d;
        }

        .code-block .j-key {
            color: #d4d4d8;
        }

        .code-block .j-num {
            color: #86efac;
        }

        .code-block .j-bool {
            color: #c4b5fd;
        }

        .code-block .j-null {
            color: #a1a1aa;
        }

        /* =====================================================================
           Tablas (minimalistas, sin caja)
           ===================================================================== */
        .table-wrap {
            margin: 0 0 18px;
            overflow-x: auto;
            border-top: 1px solid var(--border);
        }

        .table-wrap table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13.5px;
        }

        .table-wrap th {
            padding: 10px 14px 8px 0;
            border-bottom: 1px solid var(--border);
            text-align: left;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--text-subtle);
            white-space: nowrap;
        }

        .table-wrap td {
            padding: 11px 14px 11px 0;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }

        .table-wrap td:last-child,
        .table-wrap th:last-child {
            padding-right: 0;
        }

        /* ===== Estilos heredados (consola, respuesta, credenciales) ===== */
        /* ---------------- Consola "Probar" ---------------- */
        .try-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex: none;
            border: 1px solid var(--accent-strong);
            background: linear-gradient(135deg, var(--brand), var(--brand-600));
            color: #fff;
            border-radius: 8px;
            padding: 5px 12px;
            font: inherit;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            margin-left: auto;
        }

        .try-btn:hover {
            filter: brightness(1.12);
        }

        .try-btn svg {
            width: 13px;
            height: 13px;
        }

        .try-btn[aria-expanded="true"] {
            background: var(--surface-3);
            color: var(--text);
            border-color: var(--border-strong);
        }

        .console {
            border-top: 1px solid var(--border);
            background: var(--surface-2);
            padding: 16px 18px;
        }

        .console[hidden] {
            display: none;
        }

        .console-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .console-row>label {
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: .6px;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .console select,
        .console input[type="text"],
        .console textarea {
            font-family: var(--mono);
            font-size: 12.5px;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            padding: 7px 10px;
        }

        .console select {
            font-family: var(--font);
            cursor: pointer;
        }

        .console input[type="text"].url-input {
            flex: 1;
            min-width: 220px;
        }

        .console textarea {
            width: 100%;
            min-height: 150px;
            resize: vertical;
            line-height: 1.55;
            tab-size: 2;
            white-space: pre;
            overflow-wrap: normal;
            overflow-x: auto;
        }

        .console :focus-visible {
            border-color: var(--accent-strong);
        }

        .path-var {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .path-var code {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--warn);
        }

        .path-var input {
            width: 130px;
        }

        .console-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .send-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            border: 0;
            background: var(--brand);
            color: #fff;
            border-radius: 9px;
            padding: 9px 18px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .send-btn:hover:not(:disabled) {
            background: var(--brand-600);
        }

        .send-btn:disabled {
            opacity: .6;
            cursor: progress;
        }

        .send-btn svg {
            width: 15px;
            height: 15px;
        }

        .console-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-left: auto;
        }

        /* ---------------- Respuesta ---------------- */
        .response {
            margin-top: 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            overflow: hidden;
        }

        .response[hidden] {
            display: none;
        }

        .resp-head {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-bottom: 1px solid var(--border);
            background: var(--surface-2);
            flex-wrap: wrap;
        }

        .status-pill {
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 999px;
            border: 1px solid;
        }

        .status-pill.s2 {
            color: var(--ok);
            background: var(--ok-bg);
            border-color: var(--ok-border);
        }

        .status-pill.s4 {
            color: var(--warn);
            background: var(--warn-bg);
            border-color: var(--warn-border);
        }

        .status-pill.s5,
        .status-pill.err {
            color: var(--delete);
            background: var(--delete-bg);
            border-color: var(--delete);
        }

        /* Tappy en la cabecera de la respuesta: su cara adelanta el resultado. Los
           márgenes negativos evitan que la cabecera crezca por la imagen. */
        .resp-tappy {
            width: 38px;
            height: 38px;
            flex: none;
            margin: -6px -2px -6px -4px;
            object-fit: contain;
            filter: drop-shadow(0 2px 3px rgba(6, 20, 48, .28));
        }

        .resp-tappy[data-mood="trabajando"] {
            animation: tappy-working .9s ease-in-out infinite;
        }

        @keyframes tappy-working {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-2px);
            }
        }

        .resp-meta {
            font-size: 12px;
            color: var(--text-muted);
            font-family: var(--mono);
        }

        .resp-tabs {
            display: flex;
            gap: 2px;
            margin-left: auto;
        }

        .resp-tab {
            border: 0;
            background: transparent;
            color: var(--text-muted);
            font: inherit;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 7px;
            cursor: pointer;
        }

        .resp-tab[aria-selected="true"] {
            background: var(--surface-3);
            color: var(--text);
        }

        .resp-body {
            margin: 0;
            padding: 13px 15px;
            max-height: 420px;
            overflow: auto;
            background: var(--code-bg);
            color: var(--code-text);
            font-family: var(--mono);
            font-size: 12.5px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .resp-body[hidden] {
            display: none;
        }

        /* Coloreado mínimo del JSON de respuesta. */
        .resp-body .j-key {
            color: #7dd3fc;
        }

        .resp-body .j-str {
            color: #86efac;
        }

        .resp-body .j-num {
            color: #fdba74;
        }

        .resp-body .j-bool {
            color: #c4b5fd;
        }

        .resp-body .j-null {
            color: #94a3b8;
        }

        .try-warn {
            display: flex;
            gap: 8px;
            font-size: 12.5px;
            color: var(--warn);
            background: var(--warn-bg);
            border: 1px solid var(--warn-border);
            border-radius: 9px;
            padding: 8px 11px;
            margin-bottom: 12px;
        }

        /* ---------------- Modal de credenciales ---------------- */
        .creds-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(6, 16, 32, .55);
            z-index: 60;
            display: grid;
            place-items: center;
            padding: 20px;
        }

        .creds-backdrop[hidden] {
            display: none;
        }

        .creds-modal {
            width: 100%;
            max-width: 460px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow-lg);
            padding: 22px;
        }

        .creds-modal h2 {
            margin: 0 0 6px;
            font-size: 17px;
        }

        .creds-modal p.sub {
            margin: 0 0 16px;
            color: var(--text-muted);
            font-size: 13.5px;
        }

        .creds-modal label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin: 12px 0 5px;
            font-family: var(--mono);
        }

        .creds-modal input {
            width: 100%;
            padding: 9px 11px;
            border-radius: 8px;
            border: 1px solid var(--border-strong);
            background: var(--surface-2);
            font-family: var(--mono);
            font-size: 13px;
            color: var(--text);
        }

        .creds-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 20px;
        }

        .creds-actions button {
            border: 1px solid var(--border-strong);
            background: var(--surface);
            color: var(--text);
            border-radius: 9px;
            padding: 8px 15px;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .creds-actions button.primary {
            background: var(--brand);
            border-color: var(--brand);
            color: #fff;
        }

        /* ---------------- Callouts ---------------- */
        .callout {
            display: flex;
            gap: 10px;
            padding: 12px 14px;
            border-radius: 10px;
            margin: 0 0 16px;
            font-size: 14px;
            border: 1px solid;
        }

        .callout .ico {
            flex: none;
            line-height: 1.5;
        }

        .callout.warn {
            background: var(--warn-bg);
            border-color: var(--warn-border);
            color: var(--warn);
        }

        .callout.info {
            background: var(--info-bg);
            border-color: var(--info-border);
            color: var(--info);
        }

        .callout.ok {
            background: var(--ok-bg);
            border-color: var(--ok-border);
            color: var(--ok);
        }

        .callout p {
            margin: 0 0 6px;
        }

        .callout p:last-child {
            margin-bottom: 0;
        }

        .callout code.ic {
            background: rgba(127, 127, 127, .15);
            border-color: rgba(127, 127, 127, .3);
            color: inherit;
        }

        /* ---------------- Steps ---------------- */
        .steps {
            counter-reset: step;
            list-style: none;
            padding: 0;
            margin: 0 0 18px;
        }

        .steps li {
            position: relative;
            padding: 0 0 16px 40px;
            counter-increment: step;
        }

        .steps li::before {
            content: counter(step);
            position: absolute;
            left: 0;
            top: 1px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 12.5px;
            font-weight: 700;
            color: #fff;
            background: var(--brand-600);
        }

        .steps li::after {
            content: "";
            position: absolute;
            left: 13px;
            top: 31px;
            bottom: 2px;
            width: 1px;
            background: var(--border);
        }

        .steps li:last-child {
            padding-bottom: 0;
        }

        .steps li:last-child::after {
            display: none;
        }

        /* ---------------- FAQ ---------------- */
        details.faq {
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            margin-bottom: 8px;
            overflow: hidden;
        }

        details.faq summary {
            padding: 12px 15px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14.5px;
            list-style: none;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
        }

        details.faq summary::-webkit-details-marker {
            display: none;
        }

        details.faq summary::after {
            content: "+";
            font-size: 18px;
            color: var(--text-muted);
            flex: none;
        }

        details.faq[open] summary::after {
            content: "−";
        }

        details.faq .faq-body {
            padding: 0 15px 14px;
            color: var(--text-muted);
            font-size: 14px;
        }

        details.faq .faq-body p {
            margin: 0 0 8px;
        }

        /* ---------------- Cards ---------------- */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 12px;
            margin: 0 0 18px;
        }

        .card {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            background: var(--surface);
            text-decoration: none;
            color: inherit;
            display: block;
            transition: border-color .15s, transform .1s;
        }

        a.card:hover {
            border-color: var(--accent-strong);
            transform: translateY(-2px);
        }

        .card .k {
            font-size: 11.5px;
            letter-spacing: .5px;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 700;
        }

        .card .v {
            font-family: var(--mono);
            font-size: 13px;
            margin-top: 5px;
            word-break: break-all;
        }

        .card p {
            margin: 6px 0 0;
            font-size: 13.5px;
            color: var(--text-muted);
        }


        /* =====================================================================
           Ajustes sobre los estilos heredados de la consola
           ===================================================================== */
        .try-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex: none;
            margin-top: 4px;
            padding: 6px 12px;
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text);
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .try-btn:hover {
            border-color: var(--accent);
            color: var(--accent-text);
        }

        .try-btn[aria-expanded="true"] {
            background: var(--accent-soft);
            border-color: transparent;
            color: var(--accent-text);
        }

        .try-btn svg {
            width: 12px;
            height: 12px;
        }

        .console {
            margin: 0 0 22px;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
        }

        .callout {
            border-radius: 8px;
        }

        /* =====================================================================
           Asistente: panel deslizable que abre Tappy flotante
           ===================================================================== */
        .assistant {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            z-index: 61;
            width: min(460px, 100vw);
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border);
            background: var(--surface);
            box-shadow: -20px 0 60px rgba(0, 0, 0, .3);
            transform: translateX(102%);
            transition: transform .28s cubic-bezier(.4, 0, .2, 1);
        }

        .assistant[data-open="true"] {
            transform: translateX(0);
        }

        .assistant-head {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px 10px 14px 18px;
            border-bottom: 1px solid var(--border);
        }

        .assistant-head .dot {
            width: 8px;
            height: 8px;
            flex: none;
            border-radius: 50%;
            background: #16a34a;
            box-shadow: 0 0 0 3px rgba(22, 163, 74, .15);
        }

        .assistant-head .grow {
            flex: 1;
            min-width: 0;
        }

        .assistant-head .t {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.3;
        }

        .assistant-head .s {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.35;
        }

        .assistant iframe {
            flex: 1;
            width: 100%;
            min-height: 0;
            border: 0;
            background: var(--surface);
        }

        .overlay {
            position: fixed;
            inset: var(--topbar-h) 0 0 0;
            z-index: 35;
            background: rgba(15, 15, 22, .32);
        }

        /* Con el asistente abierto el fondo cubre toda la página, barra superior incluida. */
        .overlay.for-assistant {
            inset: 0;
            z-index: 60;
            background: rgba(6, 16, 34, .45);
            backdrop-filter: blur(2px);
        }

        .tappy-fab {
            position: fixed;
            right: 22px;
            bottom: 18px;
            z-index: 45;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            padding: 0;
            border: 0;
            background: none;
            font: inherit;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .tappy-fab[hidden] {
            display: none;
        }

        .tappy-fab img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            filter: drop-shadow(0 12px 16px rgba(20, 20, 40, .32));
            animation: tappy-float 3.6s ease-in-out infinite;
            transition: transform .25s cubic-bezier(.34, 1.56, .64, 1);
        }

        .tappy-fab:hover img,
        .tappy-fab:focus-visible img {
            animation-play-state: paused;
            transform: translateY(-7px) scale(1.06);
        }

        .tappy-fab:focus-visible {
            box-shadow: none;
        }

        .tappy-bubble {
            position: relative;
            max-width: 210px;
            margin-bottom: 34px;
            padding: 10px 15px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--surface);
            color: var(--text);
            font-size: 13.5px;
            font-weight: 600;
            line-height: 1.4;
            text-align: left;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            transform: translateY(6px) scale(.94);
            transform-origin: bottom right;
            transition: opacity .25s, transform .25s;
            pointer-events: none;
        }

        /* La cola del globo apunta hacia Tappy. */
        .tappy-bubble::after {
            content: "";
            position: absolute;
            right: -6px;
            bottom: 15px;
            width: 11px;
            height: 11px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            transform: rotate(-45deg);
        }

        .tappy-bubble[data-show="true"],
        .tappy-fab:hover .tappy-bubble {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        @keyframes tappy-float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        /* =====================================================================
           Búsqueda (paleta Ctrl/⌘ + K)
           ===================================================================== */
        .palette-backdrop {
            position: fixed;
            inset: 0;
            z-index: 70;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 11vh 16px 16px;
            background: rgba(15, 15, 22, .38);
        }

        /* display:flex de arriba anularía el atributo hidden. */
        .palette-backdrop[hidden],
        .overlay[hidden],
        .console[hidden] {
            display: none;
        }

        .palette {
            width: min(640px, 100%);
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
            box-shadow: var(--shadow-lg);
        }

        .palette input {
            width: 100%;
            padding: 15px 18px;
            border: 0;
            border-bottom: 1px solid var(--border);
            outline: none;
            background: transparent;
            color: var(--text);
            font: 15px var(--font);
        }

        .palette-results {
            max-height: 54vh;
            overflow-y: auto;
            padding: 6px;
        }

        .pr {
            display: grid;
            grid-template-columns: 62px minmax(0, 1fr);
            gap: 1px 10px;
            align-items: center;
            padding: 8px 10px;
            border-radius: 8px;
            color: var(--text);
            text-decoration: none;
        }

        .pr[aria-selected="true"] {
            background: var(--accent-soft);
        }

        .pr .kind {
            justify-self: start;
            grid-row: span 2;
            font-size: 11px;
            color: var(--text-subtle);
        }

        .pr .kind.badge {
            font-size: 10.5px;
            color: #fff;
        }

        .pr .ttl {
            font-size: 14px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .pr .snip {
            font-size: 12.5px;
            color: var(--text-muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .pr mark {
            background: rgba(250, 204, 21, .35);
            color: inherit;
            border-radius: 2px;
        }

        .palette-empty {
            padding: 26px 18px;
            text-align: center;
            color: var(--text-muted);
        }

        .palette-foot {
            display: flex;
            gap: 16px;
            padding: 8px 14px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-subtle);
        }

        /* =====================================================================
           Movimiento reducido
           ===================================================================== */
        @media (prefers-reduced-motion: reduce) {

            .tappy-fab img,
            .tappy-bubble,
            .resp-tappy,
            .assistant,
            .sidebar {
                animation: none !important;
                transition: none !important;
            }
        }

        /* =====================================================================
           Responsive
           ===================================================================== */

        @media (max-width: 1060px) {
            .tabs {
                gap: 18px;
            }

            .search-trigger {
                min-width: 0;
            }

            .search-trigger span,
            .search-trigger kbd {
                display: none;
            }
        }

        /* Pantallas angostas: la barra lateral también pasa a panel. */
        @media (max-width: 900px) {
            .topbar {
                grid-template-columns: 1fr auto;
                padding: 0 10px 0 8px;
            }

            .tabs {
                display: none;
            }

            .menu-btn {
                display: inline-grid;
            }

            .shell {
                grid-template-columns: minmax(0, 1fr);
            }

            .sidebar {
                position: fixed;
                top: var(--topbar-h);
                bottom: 0;
                left: 0;
                z-index: 40;
                width: min(290px, 86vw);
                background: var(--surface);
                box-shadow: var(--shadow-lg);
                transform: translateX(-102%);
                transition: transform .25s cubic-bezier(.4, 0, .2, 1);
            }

            .sidebar[data-open="true"] {
                transform: translateX(0);
            }

            .page {
                padding: 26px 18px 110px;
            }

            .page h1 {
                font-size: 23px;
            }
        }

        @media (max-width: 560px) {

            .env,
            #adminBtn {
                display: none;
            }

            .brand .docs-label {
                display: none;
            }

            .ep-row {
                grid-template-columns: 56px minmax(0, 1fr);
            }

            .ep-row .p {
                display: none;
            }

            .pager {
                grid-template-columns: 1fr;
            }

            .pager .next {
                grid-column: 1;
            }

            .tappy-fab {
                right: 12px;
                bottom: 12px;
            }

            .tappy-fab img {
                width: 92px;
                height: 92px;
            }

            .tappy-bubble {
                max-width: 170px;
                margin-bottom: 26px;
                font-size: 12.5px;
            }

            .assistant-head .s {
                display: none;
            }
        }
    </style>
</head>

<body>
    <header class="topbar">
        <div class="top-left">
            <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Abrir menú"
                aria-expanded="false" aria-controls="sidebar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M4 7h16M4 12h16M4 17h16" />
                </svg>
