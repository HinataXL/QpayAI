            /* =======================================================================
               Render
               ======================================================================= */

            var docEl = document.getElementById('doc');
            var navEl = document.getElementById('nav');

            function el(tag, cls, html) {
                var node = document.createElement(tag);
                if (cls) node.className = cls;
                if (html != null) node.innerHTML = html;
                return node;
            }

            function copyText(text, btn, label) {
                var done = function () {
                    btn.classList.add('copied');
                    var prev = btn.textContent;
                    btn.textContent = '¡Copiado!';
                    setTimeout(function () {
                        btn.classList.remove('copied');
                        btn.textContent = label || prev;
                    }, 1600);
                };
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(done, function () { legacyCopy(text); done(); });
                } else {
                    legacyCopy(text);
                    done();
                }
            }

            function legacyCopy(text) {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); } catch (e) { /* sin portapapeles */ }
                document.body.removeChild(ta);
            }

            function makeCode(code, lang) {
                var wrap = el('div', 'code-block');
                var head = el('div', 'code-head');
                head.appendChild(document.createTextNode(lang || 'json'));
                var btn = el('button', 'copy-btn', 'Copiar');
                btn.type = 'button';
                btn.addEventListener('click', function () { copyText(code, btn, 'Copiar'); });
                head.appendChild(btn);
                var pre = el('pre');
                var codeEl = document.createElement('code');
                codeEl.textContent = code;
                pre.appendChild(codeEl);
                wrap.appendChild(head);
                wrap.appendChild(pre);
                return wrap;
            }

            function makeTable(head, rows) {
                var wrap = el('div', 'table-wrap');
                var table = el('table');
                if (head) {
                    var thead = el('thead');
                    var tr = el('tr');
                    head.forEach(function (h) { tr.appendChild(el('th', null, h)); });
                    thead.appendChild(tr);
                    table.appendChild(thead);
                }
                var tbody = el('tbody');
                rows.forEach(function (row) {
                    var tr = el('tr');
                    row.forEach(function (cell) { tr.appendChild(el('td', null, cell)); });
                    tbody.appendChild(tr);
                });
                table.appendChild(tbody);
                wrap.appendChild(table);
                return wrap;
            }

            function makeParamsTable(params) {
                var rows = params.map(function (p) {
                    var badge = p[1]
                        ? '<span class="req yes">requerido</span>'
                        : '<span class="req no">opcional</span>';
                    return ['<code class="ic">' + p[0] + '</code>' + badge, p[2]];
                });
                return makeTable(['Parámetro', 'Descripción'], rows);
            }

            function renderBlock(block, host) {
                switch (block.type) {
                    case 'p':
                        host.appendChild(el('p', 'doc-p', block.html));
                        break;
                    case 'h3':
                        host.appendChild(el('h3', 'block-title', block.text));
                        break;
                    case 'list': {
                        var ul = el('ul', 'doc-list');
                        block.items.forEach(function (i) { ul.appendChild(el('li', null, i)); });
                        host.appendChild(ul);
                        break;
                    }
                    case 'steps': {
                        var ol = el('ol', 'steps');
                        block.items.forEach(function (i) { ol.appendChild(el('li', null, i)); });
                        host.appendChild(ol);
                        break;
                    }
                    case 'callout': {
                        var icons = { warn: '⚠️', info: 'ℹ️', ok: '✅' };
                        var c = el('div', 'callout ' + (block.variant || 'info'));
                        c.appendChild(el('span', 'ico', icons[block.variant] || 'ℹ️'));
                        c.appendChild(el('div', null, block.html));
                        host.appendChild(c);
                        break;
                    }
                    case 'table':
                        host.appendChild(makeTable(block.head, block.rows));
                        host.appendChild(el('div', null, '')).style.height = '16px';
                        break;
                    case 'code':
                        host.appendChild(makeCode(block.code, block.lang));
                        break;
                    case 'cards': {
                        var grid = el('div', 'cards');
                        block.items.forEach(function (item) {
                            var card = el(item.href ? 'a' : 'div', 'card');
                            if (item.href) card.href = item.href;
                            card.appendChild(el('div', 'k', item.k));
                            if (item.v) card.appendChild(el('div', 'v', item.v));
                            if (item.p) card.appendChild(el('p', null, item.p));
                            grid.appendChild(card);
                        });
                        host.appendChild(grid);
                        break;
                    }
                    case 'faq': {
                        block.items.forEach(function (item) {
                            var d = el('details', 'faq');
                            var s = el('summary', null, item[0]);
                            d.appendChild(s);
                            d.appendChild(el('div', 'faq-body', '<p>' + item[1] + '</p>'));
                            host.appendChild(d);
                        });
                        break;
                    }
                    case 'endpoint':
                        host.appendChild(renderEndpoint(block));
                        break;
                }
            }

            /* =======================================================================
               Consola de pruebas: permite lanzar cada request desde la propia
               documentación. Las peticiones pasan por try.php porque los dominios
               de QPayPro no envían cabeceras CORS al navegador.
               ======================================================================= */

            var PROD_OF = {
                'api-sandboxpayments.qpaypro.com': 'api-payments.qpaypro.com',
                'sandboxpayments.qpaypro.com': 'payments.qpaypro.com',
                'devbilling.qpaypro.com': 'billing.qpaypro.com'
            };
            var SANDBOX_OF = {};
            Object.keys(PROD_OF).forEach(function (k) { SANDBOX_OF[PROD_OF[k]] = k; });

            // Claves de autenticación que el botón "Mis credenciales" sustituye.
            var CRED_KEYS = ['x_login', 'x_private_key', 'x_api_secret', 'x_api_key', 'public_key'];
            var CREDS_STORE = 'qpay_try_creds';

            function loadCreds() {
                try {
                    var raw = localStorage.getItem(CREDS_STORE);
                    return raw ? JSON.parse(raw) : {};
                } catch (e) { return {}; }
            }

            function saveCreds(obj) {
                try { localStorage.setItem(CREDS_STORE, JSON.stringify(obj)); } catch (e) { /* modo privado */ }
            }

            function hasCreds() {
                var c = loadCreds();
                return CRED_KEYS.some(function (k) { return c[k]; });
            }

            function hostOf(url) {
                try { return new URL(url).hostname; } catch (e) { return ''; }
            }

            function swapHost(url, from, to) {
                return url.replace('://' + from, '://' + to);
            }

            function escapeHtml(s) {
                return String(s).replace(/[&<>]/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
                });
            }

            /** Colorea un JSON ya formateado. Devuelve HTML seguro (entrada escapada). */
            function highlightJson(text) {
                return escapeHtml(text).replace(
                    /("(\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false)\b|\bnull\b|-?\d+(\.\d*)?([eE][+-]?\d+)?)/g,
                    function (match) {
                        var cls = 'j-num';
                        if (/^"/.test(match)) {
                            cls = /:$/.test(match) ? 'j-key' : 'j-str';
                        } else if (/true|false/.test(match)) {
                            cls = 'j-bool';
                        } else if (/null/.test(match)) {
                            cls = 'j-null';
                        }
                        return '<span class="' + cls + '">' + match + '</span>';
                    }
                );
            }

            /** Formatea si es JSON válido; si no, devuelve el texto tal cual. */
            function prettyMaybeJson(text) {
                try {
                    return { json: true, text: JSON.stringify(JSON.parse(text), null, 2) };
                } catch (e) {
                    return { json: false, text: text };
                }
            }

            function curlFor(method, url, headers, body) {
                var lines = ["curl -X " + method + " '" + url + "'"];
                Object.keys(headers).forEach(function (h) {
                    lines.push("  -H '" + h + ": " + headers[h] + "'");
                });
                if (body && body.trim()) {
                    // Comillas simples dentro del body: se cierra, se escapa y se reabre.
                    lines.push("  -d '" + body.replace(/'/g, "'\\''") + "'");
                }
                return lines.join(" \\\n");
            }

            /**
             * Modal para guardar las credenciales propias una sola vez, en lugar de
             * escribirlas en cada una de las consolas. Se quedan en localStorage,
             * en el navegador de quien las escribe.
             */
            var credsModal = null;

            function openCredsModal(onSave) {
                if (!credsModal) {
                    credsModal = el('div', 'creds-backdrop');
                    var box = el('div', 'creds-modal');
                    box.appendChild(el('h2', null, 'Mis credenciales'));
                    box.appendChild(el('p', 'sub',
                        'Se guardan solo en este navegador y se usan para reemplazar las llaves de ' +
                        'ejemplo al pulsar «Mis credenciales» en cualquier endpoint. Deja en blanco lo que no uses.'));

                    var fields = {};
                    CRED_KEYS.forEach(function (key) {
                        var label = el('label', null, key);
                        label.htmlFor = 'cred-' + key;
                        box.appendChild(label);
                        var input = el('input');
                        input.type = 'text';
                        input.id = 'cred-' + key;
                        input.autocomplete = 'off';
                        input.spellcheck = false;
                        box.appendChild(input);
                        fields[key] = input;
                    });

                    var actions = el('div', 'creds-actions');
                    var clear = el('button', null, 'Borrar');
                    var cancel = el('button', null, 'Cancelar');
                    var save = el('button', 'primary', 'Guardar');
                    [clear, cancel, save].forEach(function (b) { b.type = 'button'; });
                    actions.appendChild(clear);
                    actions.appendChild(cancel);
                    actions.appendChild(save);
                    box.appendChild(actions);
                    credsModal.appendChild(box);
                    document.body.appendChild(credsModal);

                    credsModal.fields = fields;
                    credsModal.onSave = null;

                    function close() {
                        credsModal.hidden = true;
                        credsModal.onSave = null;
                    }

                    cancel.addEventListener('click', close);
                    credsModal.addEventListener('click', function (e) {
                        if (e.target === credsModal) close();
                    });
                    document.addEventListener('keydown', function (e) {
                        if (e.key === 'Escape' && !credsModal.hidden) close();
                    });

                    clear.addEventListener('click', function () {
                        CRED_KEYS.forEach(function (k) { fields[k].value = ''; });
                        saveCreds({});
                        close();
                    });

                    save.addEventListener('click', function () {
                        var data = {};
                        CRED_KEYS.forEach(function (k) {
                            var v = fields[k].value.trim();
                            if (v) data[k] = v;
                        });
                        saveCreds(data);
                        var cb = credsModal.onSave;
                        close();
                        if (cb) cb();
                    });
                }

                var stored = loadCreds();
                CRED_KEYS.forEach(function (k) { credsModal.fields[k].value = stored[k] || ''; });
                credsModal.onSave = onSave || null;
                credsModal.hidden = false;
                credsModal.querySelector('input').focus();
            }

            /* ---- Tappy en la consola ---- */

            var CONSOLE_MOODS = ['trabajando', 'aliviado', 'pensativo', 'triste', 'ansioso'];
            var consoleMoodsLoaded = false;

            // Se precargan al abrir la primera consola, no con la página: la mayoría de
            // visitantes lee la documentación sin probar ningún endpoint.
            function preloadConsoleMoods() {
                if (consoleMoodsLoaded) return;
                consoleMoodsLoaded = true;
                CONSOLE_MOODS.forEach(function (mood) {
                    new Image().src = 'assets/tappy/' + mood + '.png';
                });
            }

            /** QPayPro puede responder HTTP 2xx con "result": 0 cuando la operación no se concretó. */
            function businessFailed(body) {
                try {
                    var json = JSON.parse(body);
                    return !!json && typeof json === 'object' && (json.result === 0 || json.result === '0');
                } catch (e) {
                    return false;
                }
            }

            // Tappy lee la respuesta como lo haría un integrador: primero el código HTTP y,
            // si es 2xx, el campo `result`, para no celebrar un pago rechazado.
            function moodForResponse(status, body) {
                var group = Math.floor(status / 100);
                if (group === 5) return 'triste';
                if (group === 2) return businessFailed(body) ? 'pensativo' : 'aliviado';
                // 3xx (como el 303 de 3-D Secure) y 4xx: hay un paso más o algo por revisar.
                return 'pensativo';
            }

            // Errores del propio proxy (try.php), no de QPayPro.
            function moodForProxyError(proxyStatus) {
                if (proxyStatus === 429) return 'ansioso';                     // límite de pruebas
                if (proxyStatus >= 400 && proxyStatus < 500) return 'pensativo'; // URL, método o body a corregir
                return 'triste';                                                // timeout, TLS, sin conexión
            }

            function buildConsole(host, ep) {
                preloadConsoleMoods();
                var baseUrl = ep.url;
                var pathVars = (baseUrl.match(/\{[a-z_]+\}/gi) || []);

                var warn = el('div', 'try-warn',
                    '<span aria-hidden="true">🔐</span><span>Las peticiones salen desde este servidor, no desde tu navegador. ' +
                    'Usa credenciales de <strong>sandbox</strong>; no escribas llaves de producción en una página compartida.</span>');
                host.appendChild(warn);

                /* ---- Fila 1: entorno + URL ---- */
                var row1 = el('div', 'console-row');
                var currentHost = hostOf(baseUrl);
                var envSelect = null;

                if (PROD_OF[currentHost] || SANDBOX_OF[currentHost]) {
                    envSelect = el('select');
                    envSelect.setAttribute('aria-label', 'Entorno');
                    ['Sandbox', 'Producción'].forEach(function (name) {
                        var opt = document.createElement('option');
                        opt.value = name;
                        opt.textContent = name;
                        envSelect.appendChild(opt);
                    });
                    envSelect.value = SANDBOX_OF[currentHost] ? 'Producción' : 'Sandbox';
                    row1.appendChild(envSelect);
                }

                var urlInput = el('input', 'url-input');
                urlInput.type = 'text';
                urlInput.value = baseUrl;
                urlInput.setAttribute('aria-label', 'URL de la petición');
                row1.appendChild(urlInput);
                host.appendChild(row1);

                if (envSelect) {
                    envSelect.addEventListener('change', function () {
                        var h = hostOf(urlInput.value);
                        if (envSelect.value === 'Producción' && PROD_OF[h]) {
                            urlInput.value = swapHost(urlInput.value, h, PROD_OF[h]);
                        } else if (envSelect.value === 'Sandbox' && SANDBOX_OF[h]) {
                            urlInput.value = swapHost(urlInput.value, h, SANDBOX_OF[h]);
                        }
                    });
                }

                /* ---- Fila 2: variables de ruta como {id} ---- */
                var varInputs = {};
                if (pathVars.length) {
                    var row2 = el('div', 'console-row');
                    row2.appendChild(el('label', null, 'Ruta'));
                    pathVars.forEach(function (v) {
                        var name = v.slice(1, -1);
                        var wrap = el('div', 'path-var');
                        wrap.appendChild(el('code', null, v));
                        var input = el('input');
                        input.type = 'text';
                        input.placeholder = name;
                        input.setAttribute('aria-label', 'Valor de ' + v);
                        wrap.appendChild(input);
                        varInputs[v] = input;
                        row2.appendChild(wrap);
                    });
                    host.appendChild(row2);
                }

                /* ---- Body ---- */
                var bodyArea = null;
                if (ep.body) {
                    host.appendChild(el('div', 'sub-label', 'Body de la petición'));
                    bodyArea = el('textarea');
                    bodyArea.value = ep.body;
                    bodyArea.spellcheck = false;
                    bodyArea.setAttribute('aria-label', 'Cuerpo de la petición');
                    host.appendChild(bodyArea);
                }

                /* ---- Acciones ---- */
                var actions = el('div', 'console-actions');

                var sendBtn = el('button', 'send-btn',
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" ' +
                    'stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/>' +
                    '<path d="M22 2l-7 20-4-9-9-4z"/></svg><span>Enviar</span>');
                sendBtn.type = 'button';
                actions.appendChild(sendBtn);

                var credsBtn = el('button', 'mini-copy', 'Mis credenciales');
                credsBtn.type = 'button';
                credsBtn.title = 'Sustituye las llaves de ejemplo por las tuyas';
                actions.appendChild(credsBtn);

                if (bodyArea) {
                    var fmtBtn = el('button', 'mini-copy', 'Formatear');
                    fmtBtn.type = 'button';
                    fmtBtn.addEventListener('click', function () {
                        var r = prettyMaybeJson(bodyArea.value);
                        if (r.json) {
                            bodyArea.value = r.text;
                        } else {
                            flash(fmtBtn, 'JSON inválido', 'Formatear');
                        }
                    });
                    actions.appendChild(fmtBtn);
                }

                var curlBtn = el('button', 'mini-copy', 'Copiar cURL');
                curlBtn.type = 'button';
                actions.appendChild(curlBtn);

                var resetBtn = el('button', 'mini-copy', 'Restablecer');
                resetBtn.type = 'button';
                actions.appendChild(resetBtn);

                actions.appendChild(el('span', 'console-hint', 'Ctrl + Enter para enviar'));
                host.appendChild(actions);

                /* ---- Panel de respuesta ---- */
                var resp = el('div', 'response');
                resp.hidden = true;
                var respHead = el('div', 'resp-head');
                var respTappy = el('img', 'resp-tappy');
                respTappy.alt = '';
                respTappy.width = 38;
                respTappy.height = 38;
                // Decorativo: el estado lo comunican la píldora y el texto de al lado.
                respTappy.setAttribute('aria-hidden', 'true');
                var pill = el('span', 'status-pill');
                var meta = el('span', 'resp-meta');
                respHead.appendChild(respTappy);
                respHead.appendChild(pill);
                respHead.appendChild(meta);

                var tabs = el('div', 'resp-tabs');
                var tabBody = el('button', 'resp-tab', 'Respuesta');
                var tabHeaders = el('button', 'resp-tab', 'Cabeceras');
                var copyResp = el('button', 'resp-tab', 'Copiar');
                [tabBody, tabHeaders, copyResp].forEach(function (t) { t.type = 'button'; });
                tabBody.setAttribute('aria-selected', 'true');
                tabHeaders.setAttribute('aria-selected', 'false');
                tabs.appendChild(tabBody);
                tabs.appendChild(tabHeaders);
                tabs.appendChild(copyResp);
                respHead.appendChild(tabs);
                resp.appendChild(respHead);

                var outBody = el('pre', 'resp-body');
                var outHeaders = el('pre', 'resp-body');
                outHeaders.hidden = true;
                resp.appendChild(outBody);
                resp.appendChild(outHeaders);
                host.appendChild(resp);

                function setMood(mood) {
                    respTappy.src = 'assets/tappy/' + mood + '.png';
                    respTappy.dataset.mood = mood;
                }

                function showTab(which) {
                    var isBody = which === 'body';
                    outBody.hidden = !isBody;
                    outHeaders.hidden = isBody;
                    tabBody.setAttribute('aria-selected', String(isBody));
                    tabHeaders.setAttribute('aria-selected', String(!isBody));
                }
                tabBody.addEventListener('click', function () { showTab('body'); });
                tabHeaders.addEventListener('click', function () { showTab('headers'); });
                copyResp.addEventListener('click', function () {
                    copyText(outBody.textContent, copyResp, 'Copiar');
                });

                /* ---- Estado actual de la petición ---- */
                function currentUrl() {
                    var url = urlInput.value.trim();
                    Object.keys(varInputs).forEach(function (v) {
                        var val = varInputs[v].value.trim();
                        if (val) url = url.replace(v, encodeURIComponent(val));
                    });
                    return url;
                }

                function currentHeaders() {
                    var headers = {};
                    (ep.headers || []).forEach(function (h) { headers[h[0]] = h[1]; });
                    if (bodyArea && !headers['Content-Type']) {
                        headers['Content-Type'] = 'application/json';
                    }
                    return headers;
                }

                function flash(btn, text, original) {
                    btn.textContent = text;
                    btn.classList.add('copied');
                    setTimeout(function () {
                        btn.textContent = original;
                        btn.classList.remove('copied');
                    }, 1600);
                }

                credsBtn.addEventListener('click', function () {
                    if (!hasCreds()) {
                        openCredsModal(function () { credsBtn.click(); });
                        return;
                    }
                    if (!bodyArea) {
                        flash(credsBtn, 'Sin body', 'Mis credenciales');
                        return;
                    }
                    var creds = loadCreds();
                    var applied = 0;
                    var text = bodyArea.value;
                    CRED_KEYS.forEach(function (key) {
                        if (!creds[key]) return;
                        // Solo sustituye la clave si ya existe en el body de ejemplo.
                        var re = new RegExp('("' + key + '"\\s*:\\s*)"[^"]*"');
                        if (re.test(text)) {
                            text = text.replace(re, '$1"' + creds[key].replace(/"/g, '\\"') + '"');
                            applied++;
                        }
                    });
                    bodyArea.value = text;
                    flash(credsBtn, applied ? applied + ' aplicadas' : 'No aplica aquí', 'Mis credenciales');
                });

                curlBtn.addEventListener('click', function () {
                    copyText(
                        curlFor(ep.method, currentUrl(), currentHeaders(), bodyArea ? bodyArea.value : ''),
                        curlBtn, 'Copiar cURL'
                    );
                });

                resetBtn.addEventListener('click', function () {
                    urlInput.value = baseUrl;
                    if (envSelect) envSelect.value = SANDBOX_OF[hostOf(baseUrl)] ? 'Producción' : 'Sandbox';
                    Object.keys(varInputs).forEach(function (v) { varInputs[v].value = ''; });
                    if (bodyArea) bodyArea.value = ep.body;
                    resp.hidden = true;
                });

                if (bodyArea) {
                    bodyArea.addEventListener('keydown', function (e) {
                        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                            e.preventDefault();
                            sendBtn.click();
                        }
                    });
                }

                /* ---- Envío ---- */
                sendBtn.addEventListener('click', function () {
                    var missing = Object.keys(varInputs).filter(function (v) {
                        return !varInputs[v].value.trim();
                    });
                    if (missing.length) {
                        resp.hidden = false;
                        setMood('pensativo');
                        pill.className = 'status-pill err';
                        pill.textContent = 'Falta dato';
                        meta.textContent = '';
                        outBody.textContent = 'Completa el valor de ' + missing.join(', ') +
                            ' antes de enviar la petición.';
                        showTab('body');
                        varInputs[missing[0]].focus();
                        return;
                    }

                    sendBtn.disabled = true;
                    sendBtn.querySelector('span').textContent = 'Enviando…';
                    resp.hidden = false;
                    setMood('trabajando');
                    pill.className = 'status-pill';
                    pill.textContent = '···';
                    meta.textContent = 'esperando respuesta';
                    outBody.textContent = '';
                    showTab('body');

                    var proxyStatus = 0;
                    fetch('try.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            url: currentUrl(),
                            method: ep.method,
                            headers: currentHeaders(),
                            body: bodyArea ? bodyArea.value : ''
                        })
                    }).then(function (r) {
                        proxyStatus = r.status;
                        return r.json().catch(function () {
                            throw new Error('El proxy devolvió una respuesta ilegible. ¿Está PHP activo?');
                        });
                    }).then(function (data) {
                        if (!data.ok) {
                            setMood(moodForProxyError(proxyStatus));
                            pill.className = 'status-pill err';
                            pill.textContent = 'Error';
                            meta.textContent = data.ms ? data.ms + ' ms' : '';
                            outBody.textContent = data.error || 'Error desconocido.';
                            return;
                        }

                        var group = Math.floor(data.status / 100);
                        pill.className = 'status-pill s' + (group === 2 ? '2' : group === 4 ? '4' : group === 5 ? '5' : '');
                        pill.textContent = data.status;
                        setMood(moodForResponse(data.status, data.body));
                        meta.textContent = data.ms + ' ms · ' +
                            (data.size < 1024 ? data.size + ' B' : (data.size / 1024).toFixed(1) + ' KB') +
                            (data.truncated ? ' (recortado)' : '') +
                            // La píldora sigue mostrando el HTTP real; esto explica por qué
                            // Tappy no celebra un 200 que QPayPro marcó como no exitoso.
                            (group === 2 && businessFailed(data.body) ? ' · result: 0' : '');

                        var pretty = prettyMaybeJson(data.body);
                        if (pretty.json) {
                            outBody.innerHTML = highlightJson(pretty.text);
                        } else {
                            outBody.textContent = pretty.text || '(respuesta vacía)';
                        }

                        outHeaders.textContent = Object.keys(data.headers || {}).map(function (h) {
                            return h + ': ' + data.headers[h];
                        }).join('\n') || '(sin cabeceras)';
                    }).catch(function (e) {
                        setMood('triste');
                        pill.className = 'status-pill err';
                        pill.textContent = 'Error';
                        meta.textContent = '';
                        outBody.textContent = e.message;
                    }).finally(function () {
                        sendBtn.disabled = false;
                        sendBtn.querySelector('span').textContent = 'Enviar';
                    });
                });
            }


            /* =======================================================================
               Vista de una página: cada sección y cada endpoint tiene su propia
               ruta (#id). Los enlaces internos del contenido ya usan esos ids.
               ======================================================================= */

            var mainEl = document.getElementById('main');
            var START_IDS = ['introduccion', 'autenticacion', 'entornos'];
            var HELP_IDS = ['faq', 'errores', 'soporte'];
            var SHORT_LABEL = {
                checkout: 'Checkout',
                pagos: 'Pagos',
                'pagos3ds-bac': '3DS BAC',
                tokenizacion: 'Tokenización',
                pagos3ds2: '3D-Secure 2',
                qpayfel: 'QpayFel',
                suscripciones: 'Cobros automáticos'
            };
            var ENV_STORE = 'qpay-docs-env';

            var sectionsById = {};
            var endpointsById = {};
            var routes = [];            // orden lineal para Anterior / Siguiente
            var currentRoute = null;

            DOCS.forEach(function (section) {
                sectionsById[section.id] = section;
                section.blocks.forEach(function (b) {

                });

            var apiSections = DOCS.filter(function (s) {
                return START_IDS.indexOf(s.id) === -1 && HELP_IDS.indexOf(s.id) === -1;
            });

                return section.blocks.filter(function (b) { return b.type === 'endpoint'; });

                return SHORT_LABEL[section.id] || section.title;

            START_IDS.forEach(function (id) { if (sectionsById[id]) routes.push(id); });
            apiSections.forEach(function (s) {
                routes.push(s.id);
                endpointsOf(s).forEach(function (ep) { routes.push(ep.id); });
            });
            HELP_IDS.forEach(function (id) { if (sectionsById[id]) routes.push(id); });

            function titleOf(id) {
                if (endpointsById[id]) return endpointsById[id].ep.name;
                return sectionsById[id] ? sectionsById[id].title : '';
            }

            // No se reutiliza `el(tag, cls, html)` para textos: esto escribe textContent.
            function textEl(tag, cls, text) {
                var node = document.createElement(tag);
                if (cls) node.className = cls;
                node.textContent = text;
                return node;
            }

            /* ---------------- Entorno (sandbox / producción) ---------------- */

            var envSelect = document.getElementById('envSelect');
            var currentEnv = 'sandbox';
            try { if (localStorage.getItem(ENV_STORE) === 'produccion') currentEnv = 'produccion'; } catch (e) { /* sin storage */ }
            envSelect.value = currentEnv;

            // Solo se cambia de host cuando la documentación da la URL de sandbox y existe
            // su equivalente de producción. Las URL documentadas únicamente en producción
            // (QpayFel, cobros automáticos) se muestran tal cual: no se inventa un sandbox.
            function hasSandboxPair(url) {
                return !!PROD_OF[hostOf(url)];
            }

            function envUrl(url) {
                var h = hostOf(url);
                return currentEnv === 'produccion' && PROD_OF[h] ? swapHost(url, h, PROD_OF[h]) : url;
            }

            function pathOf(url) {
                try {
                    return decodeURIComponent(new URL(url).pathname);
                } catch (e) {
                    return url;
                }
            }

            envSelect.addEventListener('change', function () {
                currentEnv = envSelect.value;
                try { localStorage.setItem(ENV_STORE, currentEnv); } catch (e) { /* sin storage */ }

            /* ---------------- Barra lateral ---------------- */

            function navLink(id, text) {

            function buildNav() {
                navEl.appendChild(textEl('div', 'nav-label', 'Empezar'));
                START_IDS.forEach(function (id) {

                });

                apiSections.forEach(function (section) {
                    navEl.appendChild(textEl('div', 'nav-label', shortLabel(section)));

            /* ---------------- Piezas de página ---------------- */

            function crumbs(parts) {
                var nav = el('nav', 'crumbs');

            function groupCrumb(section) {

            // renderBlock (heredado) sin colorear; aquí se colorean los JSON de ejemplo.
            function renderBlockPlus(block, host) {
                renderBlock(block, host);

            function endpointRow(ep) {

            // Lo usa renderBlock para bloques 'endpoint'; en esta vista se listan como filas.

            function pager(id) {
                var i = routes.indexOf(id);

                wrap.setAttribute('aria-label', 'Páginas anterior y siguiente');
                if (i > 0) {
                    var prev = el('a', 'prev');
                    prev.href = '#' + routes[i - 1];
                    prev.appendChild(textEl('small', null, '← Anterior'));
                    prev.appendChild(document.createTextNode(titleOf(routes[i - 1])));
                    wrap.appendChild(prev);
                }
                if (i >= 0 && i < routes.length - 1) {
                    var next = el('a', 'next');
                    next.href = '#' + routes[i + 1];
                    next.appendChild(textEl('small', null, 'Siguiente →'));
                    next.appendChild(document.createTextNode(titleOf(routes[i + 1])));
                    wrap.appendChild(next);

            /* ---------------- Página de sección ---------------- */

            function renderSectionPage(section) {
                var page = docEl;
                var parts = [{ text: 'Referencia API', href: '#introduccion' }];
                var group = groupCrumb(section);
                if (group.href !== '#' + section.id) parts.push(group);
                parts.push({ text: section.id in SHORT_LABEL ? 'Descripción general' : section.title });
                page.appendChild(crumbs(parts));

                page.appendChild(textEl('h1', null, section.title));
                if (section.intro) page.appendChild(textEl('p', 'lead', section.intro));

                // Se respeta el orden original: los endpoints consecutivos se agrupan en
                // una lista, y los bloques de explicación quedan en su lugar entre ellos.
                var list = null;
                section.blocks.forEach(function (block) {
                    if (block.type === 'endpoint') {
                        if (!list) {
                            list = el('div', 'ep-list');
                            page.appendChild(list);
                        }
                        list.appendChild(endpointRow(block));

                    list = null;
                    renderBlockPlus(block, page);

                page.appendChild(pager(section.id));

            /* ---------------- Página de endpoint ---------------- */

            function highlightCurl(text) {
                return escapeHtml(text).replace(/('[^']*')|(^|\s)(-[A-Za-z])\b|^(curl)\b/gm,
                    function (m, str, space, flag, cmd) {
                        if (str) return '<span class="c-str">' + str + '</span>';
                        if (flag) return space + '<span class="c-flag">' + flag + '</span>';
                        return '<span class="c-cmd">' + cmd + '</span>';
                    });
            }

            function requestHeaders(ep) {
                var headers = {};
                (ep.headers || []).forEach(function (h) { headers[h[0]] = h[1]; });
                if (ep.body && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
                return headers;
            }

            function requestBlock(ep) {
                var url = envUrl(ep.url);
                var curl = curlFor(ep.method, url, requestHeaders(ep), ep.body || '');
                var views = [{ id: 'curl', label: 'cURL', raw: curl, html: '<span class="c-com">// solicitud</span>\n' + highlightCurl(curl) }];
                if (ep.body) {
                    views.push({ id: 'json', label: 'JSON', raw: ep.body, html: '<span class="c-com">// body</span>\n' + highlightJson(ep.body) });
                }

                var wrap = el('div', 'code-block request');
                var head = el('div', 'code-head');
                var tabs = el('div', 'code-tabs');
                tabs.setAttribute('role', 'tablist');
                var code = document.createElement('code');
                var active = views[0];

                function show(view) {
                    active = view;
                    code.innerHTML = view.html;
                    [].forEach.call(tabs.children, function (b) {
                        b.setAttribute('aria-selected', String(b.dataset.view === view.id));
                    });

                views.forEach(function (view) {
                    var b = textEl('button', null, view.label);
                    b.type = 'button';
                    b.setAttribute('role', 'tab');
                    b.dataset.view = view.id;
                    b.addEventListener('click', function () { show(view); });
                    tabs.appendChild(b);
                });

                var copy = textEl('button', 'copy-btn', 'Copiar');
                copy.type = 'button';
                copy.addEventListener('click', function () { copyText(active.raw, copy, 'Copiar'); });

                head.appendChild(tabs);
                head.appendChild(copy);
                var pre = document.createElement('pre');
                pre.appendChild(code);
                wrap.appendChild(head);
                wrap.appendChild(pre);
                show(views[0]);
                return wrap;
            }

            function rowsFrom(items) {

                    var meta = textEl('div', 'row-meta' + (item.metaClass ? ' ' + item.metaClass : ''), item.meta);
                    row.appendChild(meta);
                    if (item.desc) row.appendChild(el('div', 'row-desc', item.desc));   // HTML propio del contenido
                    wrap.appendChild(row);
                });
                return wrap;
            }

            var openConsole = null;   // función para abrir la consola de la página actual

            function renderEndpointPage(ep, section) {

                titleRow.appendChild(textEl('h1', null, ep.name));
                var tryBtn = el('button', 'try-btn',

                    '<span>Probar</span>');

                tryBtn.setAttribute('aria-expanded', 'false');
                titleRow.appendChild(tryBtn);
                page.appendChild(titleRow);

                var url = envUrl(ep.url);
                var line = el('div', 'ep-line');

                line.appendChild(textEl('span', 'path', pathOf(url)));
                page.appendChild(line);

                var hostLine = el('div', 'ep-host');
                hostLine.appendChild(textEl('span', 'host', url.replace(/^(https?:\/\/[^/]+).*$/, '$1')));
                hostLine.appendChild(textEl('span', 'env-tag',
                    hasSandboxPair(ep.url) ? (currentEnv === 'produccion' ? 'producción' : 'sandbox') : 'solo producción documentada'));
                var copyUrl = textEl('button', 'mini-copy', 'Copiar URL');
                copyUrl.type = 'button';
                copyUrl.addEventListener('click', function () { copyText(url, copyUrl, 'Copiar URL'); });
                hostLine.appendChild(copyUrl);
                page.appendChild(hostLine);

                if (ep.desc) page.appendChild(textEl('p', 'lead', ep.desc));

                page.appendChild(requestBlock(ep));

                // Consola "Probar": se construye al abrirla por primera vez.
                var panel = el('div', 'console');

                openConsole = function (forceOpen) {

                    if (open && !panel.dataset.built) {

                        if (sel && hasSandboxPair(ep.url)) {
                            sel.value = currentEnv === 'produccion' ? 'Producción' : 'Sandbox';
                            sel.dispatchEvent(new Event('change'));

                    }
                    panel.hidden = !open;

                    tryBtn.querySelector('span').textContent = open ? 'Cerrar' : 'Probar';
                    if (open) {

                };
                tryBtn.addEventListener('click', function () { openConsole(false); });

                if (ep.headers && ep.headers.length) {
                    page.appendChild(textEl('div', 'sub-label', 'Encabezados'));
                    page.appendChild(rowsFrom(ep.headers.map(function (h) {

                    })));
                }

                if (ep.params && ep.params.length) {
                    page.appendChild(textEl('div', 'sub-label', 'Parámetros del cuerpo'));
                    page.appendChild(rowsFrom(ep.params.map(function (p) {

            /* ---------------- Enrutador ---------------- */

            var tabsEl = document.querySelector('.tabs');

            function render(requested, opts) {
                opts = opts || {};
                var id = (endpointsById[requested] || sectionsById[requested]) ? requested : 'introduccion';
                var prevScroll = mainEl.scrollTop;
                currentRoute = id;
                openConsole = null;
                docEl.innerHTML = '';

                if (endpointsById[id]) {
                    renderEndpointPage(endpointsById[id].ep, endpointsById[id].section);
                } else {
                    renderSectionPage(sectionsById[id]);
                }

                navEl.querySelectorAll('[aria-current]').forEach(function (a) { a.removeAttribute('aria-current'); });
                var link = navEl.querySelector('[data-route="' + id + '"]');
                if (link) {
                    link.setAttribute('aria-current', 'page');
                    link.scrollIntoView({ block: 'nearest' });
                }

                var tab = HELP_IDS.indexOf(id) !== -1 ? id : 'ref';
                tabsEl.querySelectorAll('.tab').forEach(function (t) {
                    if (t.dataset.tab === tab) t.setAttribute('aria-current', 'page');
                    else t.removeAttribute('aria-current');
                });

                mainEl.scrollTop = opts.keepScroll ? prevScroll : 0;
                document.title = titleOf(id) + ' · QPayPro Docs';
                sendContext();
                closeSidebar();
            }

            window.addEventListener('hashchange', function () {
                render(decodeURIComponent(location.hash.slice(1)));
            });

            /* ---------------- Búsqueda en todo el contenido ---------------- */

            var parser = new DOMParser();

            // DOMParser no ejecuta scripts ni manejadores: seguro para extraer texto.
            function plain(html) {
                return (parser.parseFromString(String(html || ''), 'text/html').body.textContent || '')
                    .replace(/\s+/g, ' ').trim();
            }

            function norm(s) {
                // Quita tildes: "tokenizacion" encuentra "Tokenización".
                return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
            }

            function blockText(b) {
                switch (b.type) {
                    case 'p':
                    case 'callout': return plain(b.html);
                    case 'h3': return b.text;
                    case 'list':
                    case 'steps': return b.items.map(plain).join(' ');
                    case 'code': return b.code;
                    case 'table': return [].concat(b.head || [], [].concat.apply([], b.rows)).map(plain).join(' ');
                    case 'cards': return b.items.map(function (c) { return [c.k, c.v, c.p].join(' '); }).join(' ');
                    case 'faq': return b.items.map(function (q) { return plain(q[0]) + ' ' + plain(q[1]); }).join(' ');
                    default: return '';
                }
            }

            var searchIndex = [];

            function buildIndex() {
                DOCS.forEach(function (section) {
                    var texts = [section.intro || ''];
                    section.blocks.forEach(function (b) {
                        if (b.type !== 'endpoint') texts.push(blockText(b));

                        // Cada fila de una tabla de errores y cada pregunta frecuente son
                        // resultados propios: quien busca "502" quiere esa fila, no la sección.
                        if (b.type === 'table' && section.id === 'errores') {
                            b.rows.forEach(function (row) {
                                searchIndex.push({ id: section.id, kind: 'Error', title: plain(row[0]), text: plain(row.join(' ')) });
                            });
                        }
                        if (b.type === 'faq') {
                            b.items.forEach(function (q) {
                                searchIndex.push({ id: section.id, kind: 'FAQ', title: plain(q[0]), text: plain(q[1]) });
                            });
                        }
                        if (b.type === 'endpoint') {
                            var ep = b;
                            searchIndex.push({
                                id: ep.id,
                                kind: ep.method,
                                title: ep.name,
                                text: [shortLabel(section), ep.url, ep.desc || '',
                                    (ep.params || []).map(function (p) { return p[0] + ' ' + plain(p[2]); }).join(' '),
                                    (ep.headers || []).map(function (h) { return h.join(' '); }).join(' '),
                                    ep.body || '',
                                    (ep.after || []).map(blockText).join(' ')].join(' ')
                            });
                        }
                    });
                    searchIndex.push({ id: section.id, kind: 'Sección', title: section.title, text: texts.join(' ') });
                });
                searchIndex.forEach(function (item) {
                    item.nTitle = norm(item.title);
                    item.nText = norm(item.text);
                });
            }

            function search(query) {
                var tokens = norm(query).split(/\s+/).filter(Boolean);
                if (!tokens.length) return [];
                var nq = tokens.join(' ');
                return searchIndex.map(function (item) {
                    var hay = item.nTitle + ' ' + item.nText;
                    for (var i = 0; i < tokens.length; i++) {
                        if (hay.indexOf(tokens[i]) === -1) return null;
                    }
                    var score = 0;
                    if (item.nTitle === nq) score += 40;
                    if (item.nTitle.indexOf(nq) === 0) score += 20;
                    if (item.nTitle.indexOf(nq) !== -1) score += 12;
                    tokens.forEach(function (t) { if (item.nTitle.indexOf(t) !== -1) score += 4; });
                    if (item.kind !== 'Sección') score += 1;
                    return { item: item, score: score };
                }).filter(Boolean).sort(function (a, b) { return b.score - a.score; }).slice(0, 40);
            }

            /** Fragmento del texto alrededor de la primera coincidencia, con las coincidencias marcadas. */
            function snippet(item, tokens) {
                var text = item.text;
                var nText = item.nText;
                var at = -1;
                tokens.forEach(function (t) {
                    var i = nText.indexOf(t);
                    if (i !== -1 && (at === -1 || i < at)) at = i;
                });
                if (at === -1) at = 0;
                var start = Math.max(0, at - 40);
                var slice = text.slice(start, start + 150);
                var nSlice = norm(slice);
                var marks = [];
                tokens.forEach(function (t) {
                    var from = 0;
                    var i;
                    while (t && (i = nSlice.indexOf(t, from)) !== -1) {
                        marks.push([i, i + t.length]);
                        from = i + t.length;
                    }
                });
                marks.sort(function (a, b) { return a[0] - b[0]; });
                var html = '';
                var pos = 0;
                marks.forEach(function (m) {
                    if (m[0] < pos) return;
                    html += escapeHtml(slice.slice(pos, m[0])) + '<mark>' + escapeHtml(slice.slice(m[0], m[1])) + '</mark>';
                    pos = m[1];
                });
                html += escapeHtml(slice.slice(pos));
                return (start > 0 ? '…' : '') + html;
            }

            var palette = document.getElementById('palette');
            var paletteInput = document.getElementById('paletteInput');
            var paletteResults = document.getElementById('paletteResults');
            var paletteSel = 0;
            var lastFocusBeforePalette = null;

            function renderResults() {
                var q = paletteInput.value;
                var tokens = norm(q).split(/\s+/).filter(Boolean);
                paletteResults.innerHTML = '';
                paletteSel = 0;

                if (!tokens.length) {
                    paletteResults.appendChild(textEl('div', 'palette-empty', 'Escribe para buscar en toda la documentación: endpoints, parámetros, errores y preguntas frecuentes.'));
                    return;
                }
                var results = search(q);
                if (!results.length) {
                    paletteResults.appendChild(textEl('div', 'palette-empty', 'Sin resultados para «' + q + '». Prueba preguntarle a Tappy.'));
                    return;
                }
                results.forEach(function (r, i) {
                    var a = el('a', 'pr');
                    a.href = '#' + r.item.id;
                    a.setAttribute('role', 'option');
                    a.setAttribute('aria-selected', String(i === 0));
                    var isMethod = /^(GET|POST|PUT|DELETE)$/.test(r.item.kind);
                    a.appendChild(textEl('span', 'kind' + (isMethod ? ' badge ' + r.item.kind : ''), r.item.kind));
                    a.appendChild(textEl('span', 'ttl', r.item.title));
                    a.appendChild(el('span', 'snip', snippet(r.item, tokens)));
                    a.addEventListener('mousemove', function () { select(i); });
                    a.addEventListener('click', function () { closePalette(true); });
                    paletteResults.appendChild(a);
                });
            }

            function select(i) {
                var items = paletteResults.querySelectorAll('.pr');
                if (!items.length) return;
                paletteSel = (i + items.length) % items.length;
                items.forEach(function (item, k) { item.setAttribute('aria-selected', String(k === paletteSel)); });
                items[paletteSel].scrollIntoView({ block: 'nearest' });
            }

            function openPalette() {
                lastFocusBeforePalette = document.activeElement;
                palette.hidden = false;
                paletteInput.value = '';
                renderResults();
                paletteInput.focus();
            }

            function closePalette(navigating) {
                palette.hidden = true;
                if (!navigating && lastFocusBeforePalette && lastFocusBeforePalette.focus) lastFocusBeforePalette.focus();
            }

            paletteInput.addEventListener('input', renderResults);
            paletteInput.addEventListener('keydown', function (e) {
                if (e.key === 'ArrowDown') { e.preventDefault(); select(paletteSel + 1); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); select(paletteSel - 1); }
                else if (e.key === 'Enter') {
                    var item = paletteResults.querySelectorAll('.pr')[paletteSel];
                    if (item) {
                        e.preventDefault();
                        closePalette(true);
                        location.hash = item.getAttribute('href');
                    }
                }
            });
            palette.addEventListener('click', function (e) {
                if (e.target === palette) closePalette(false);
            });
            document.getElementById('searchBtn').addEventListener('click', openPalette);
            if (/Mac|iPhone|iPad/.test(navigator.platform || '')) {
                document.getElementById('searchKbd').textContent = '⌘ K';
            }

            /* ---------------- Tema ---------------- */

            var themeBtn = document.getElementById('themeBtn');
            var themeIcon = document.getElementById('themeIcon');
            var aiFrame = document.getElementById('aiFrame');

            function postToFrame(message) {
                if (aiFrame.src && aiFrame.contentWindow) aiFrame.contentWindow.postMessage(message, '*');
            }

            function applyTheme(theme) {
                document.documentElement.dataset.theme = theme;
                themeIcon.innerHTML = theme === 'dark'
                    ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
                    : '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
                themeBtn.setAttribute('aria-label', theme === 'dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro');
                try { localStorage.setItem('qpay-theme', theme); } catch (e) { /* sin storage */ }
                postToFrame({ type: 'qpay-theme', theme: theme });
            }

            var storedTheme = null;
            try { storedTheme = localStorage.getItem('qpay-theme'); } catch (e) { /* sin storage */ }
            applyTheme(storedTheme || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

            themeBtn.addEventListener('click', function () {
                applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
            });

            document.getElementById('credsBtn').addEventListener('click', function () {
                openCredsModal();
            });

            /* ---------------- Asistente ---------------- */

            var assistant = document.getElementById('assistant');
            var overlay = document.getElementById('overlay');
            var sidebar = document.getElementById('sidebar');
            var menuBtn = document.getElementById('menuBtn');
            var fab = document.getElementById('aiFab');
            var bubble = document.getElementById('tappyBubble');
            var lastFocusBeforeAssistant = null;
            var narrowMq = window.matchMedia('(max-width: 900px)');

            // Qué está mirando el usuario, para que Tappy responda sobre eso.
            function contextFor(id) {
                var entry = endpointsById[id];
                if (entry) {
                    return {
                        kind: 'endpoint',
                        label: entry.ep.method + ' ' + entry.ep.name,
                        url: envUrl(entry.ep.url),
                        placeholder: 'Pregunta sobre este endpoint…'
                    };
                }
                return {
                    kind: 'section',
                    label: sectionsById[id] ? sectionsById[id].title : '',
                    placeholder: 'Pregunta sobre esta sección…'
                };
            }

            function sendContext() {
                if (currentRoute) postToFrame({ type: 'qpay-context', context: contextFor(currentRoute) });
            }

            function ensureFrame() {
                if (aiFrame.src) return;
                aiFrame.addEventListener('load', function () {
                    postToFrame({ type: 'qpay-theme', theme: document.documentElement.dataset.theme });
                    sendContext();
                });
                aiFrame.src = aiFrame.dataset.src;
            }

            function syncOverlay() {
                var assistantOpen = assistant.dataset.open === 'true';
                overlay.hidden = !assistantOpen && sidebar.dataset.open !== 'true';
                overlay.classList.toggle('for-assistant', assistantOpen);
                fab.hidden = assistantOpen;
            }

            function openAssistant() {
                // El chat se carga la primera vez que se abre, no con la página.
                ensureFrame();
                lastFocusBeforeAssistant = document.activeElement;
                closeSidebar();
                hideBubble();
                assistant.dataset.open = 'true';
                syncOverlay();
                setTimeout(function () { aiFrame.focus(); }, 280);
            }

            function closeAssistant() {
                if (assistant.dataset.open !== 'true') return;
                assistant.dataset.open = 'false';
                syncOverlay();
                if (lastFocusBeforeAssistant && lastFocusBeforeAssistant.focus) lastFocusBeforeAssistant.focus();
            }

            /* Globo de Tappy: aparece cada 10 s, se muestra unos segundos y se oculta.
               No aparece mientras el asistente, el menú o la búsqueda están abiertos,
               ni con la pestaña en segundo plano. */
            var BUBBLE_EVERY_MS = 10000;
            var BUBBLE_VISIBLE_MS = 4000;
            var bubbleHideTimer = null;

            function hideBubble() {
                clearTimeout(bubbleHideTimer);
                delete bubble.dataset.show;
            }

            function showBubble() {
                if (document.hidden || assistant.dataset.open === 'true' ||
                    sidebar.dataset.open === 'true' || !palette.hidden) return;
                bubble.dataset.show = 'true';
                clearTimeout(bubbleHideTimer);
                bubbleHideTimer = setTimeout(hideBubble, BUBBLE_VISIBLE_MS);
            }

            setInterval(showBubble, BUBBLE_EVERY_MS);

            function closeSidebar() {
                if (sidebar.dataset.open !== 'true') return;
                sidebar.dataset.open = 'false';
                menuBtn.setAttribute('aria-expanded', 'false');
                syncOverlay();
            }

            fab.addEventListener('click', openAssistant);
            document.getElementById('assistantClose').addEventListener('click', closeAssistant);
            document.getElementById('assistantReset').addEventListener('click', function () {
                postToFrame({ type: 'qpay-reset' });
            });

            /* ---------------- Menú lateral en pantallas angostas ---------------- */

            menuBtn.addEventListener('click', function () {
                var open = sidebar.dataset.open !== 'true';
                if (open) closeAssistant();
                sidebar.dataset.open = open ? 'true' : 'false';
                menuBtn.setAttribute('aria-expanded', String(open));
                syncOverlay();
            });

            overlay.addEventListener('click', function () {
                closeAssistant();
                closeSidebar();
            });

            narrowMq.addEventListener('change', function (e) {
                if (!e.matches) closeSidebar();
            });

            /* ---------------- Teclado ---------------- */

            document.addEventListener('keydown', function (e) {
                if ((e.key === 'k' || e.key === 'K') && (e.metaKey || e.ctrlKey)) {
                    e.preventDefault();
                    if (palette.hidden) openPalette();
                    else closePalette(false);
                    return;
                }
                if (e.key === 'Escape') {
                    if (!palette.hidden) closePalette(false);
                    else if (assistant.dataset.open === 'true') closeAssistant();
                    else closeSidebar();
                }
            });

            /* ---------------- Arranque ---------------- */

            buildNav();
            buildIndex();
            render(decodeURIComponent(location.hash.slice(1)));
        })();
    </script>
</body>

</html>
