<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Agente de IA de Qpaypro: diagnostica errores de integración de la API en segundos.">
    <meta name="color-scheme" content="light dark">
    <title>Qpaypro · Tappy AI Support</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
    <style>
        :root {
            --brand: #002D72;
            --brand-600: #003c96;
            --accent: #00D1FF;
            --accent-strong: #00a9d1;

            --bg: #eef2f8;
            --surface: #ffffff;
            --surface-2: #f6f8fc;
            --surface-3: #eaeff7;
            --border: #dde4ef;
            --text: #16202e;
            --text-muted: #5c6b80;

            --bubble-user-bg: linear-gradient(135deg, #003c96, #002D72);
            --bubble-user-text: #ffffff;
            --bubble-ia-bg: #ffffff;
            --bubble-ia-text: #1b2734;

            --code-bg: #0f172a;
            --code-text: #e2e8f0;
            --code-border: #1e293b;

            --danger: #b42318;
            --danger-bg: #fef3f2;
            --danger-border: #fda29b;
            --warn: #b54708;
            --warn-bg: #fffaeb;
            --warn-border: #fedf89;
            --ok: #067647;

            --radius-lg: 18px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow-lg: 0 24px 60px rgba(6, 20, 48, .28);
            --shadow-sm: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .10);
            --ring: 0 0 0 3px rgba(0, 209, 255, .35);

            --font: 'Segoe UI', system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
            --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        }

        html[data-theme="dark"] {
            --surface: #111a2b;
            --surface-2: #0e1626;
            --surface-3: #18233a;
            --border: #223049;
            --text: #e6edf7;
            --text-muted: #97a6bd;

            --bubble-user-bg: linear-gradient(135deg, #1b4fb0, #0d2a63);
            --bubble-ia-bg: #16213a;
            --bubble-ia-text: #dde6f4;

            --code-bg: #060b16;
            --code-text: #d7e3f4;
            --code-border: #1c2942;

            --danger: #ff9a90;
            --danger-bg: #2a1412;
            --danger-border: #7a2b23;
            --warn: #f5c26b;
            --warn-bg: #241a08;
            --warn-border: #6b4c14;
            --ok: #5fd39b;

            --shadow-lg: 0 24px 60px rgba(0, 0, 0, .55);
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: var(--font);
            color: var(--text);
            background:
                radial-gradient(1200px 600px at 12% -10%, rgba(0, 209, 255, .18), transparent 60%),
                radial-gradient(900px 500px at 110% 110%, rgba(0, 45, 114, .35), transparent 55%),
                var(--brand);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        html[data-theme="dark"] body {
            background:
                radial-gradient(1200px 600px at 12% -10%, rgba(0, 209, 255, .12), transparent 60%),
                radial-gradient(900px 500px at 110% 110%, rgba(20, 60, 140, .35), transparent 55%),
                #060b16;
        }

        /* ---------- Shell ---------- */
        .chat-container {
            width: 100%;
            max-width: 860px;
            height: min(92vh, 900px);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .chat-container::before {
            content: "";
            position: absolute;
            inset: 0 0 auto 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent), #4f8cff, var(--brand));
        }

        /* ---------- Header ---------- */
        .chat-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .chat-header .logo {
            height: 34px;
            width: auto;
            flex: none;
        }

        /* El PNG del logo no es transparente: en tema oscuro le damos una placa blanca intencional. */
        html[data-theme="dark"] .chat-header .logo {
            background: #fff;
            padding: 4px 8px;
            border-radius: 8px;
            height: 34px;
            box-sizing: content-box;
        }

        .chat-header .titles {
            min-width: 0;
            flex: 1;
        }

        .chat-header h1 {
            margin: 0;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: .2px;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-header .status {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 2px 0 0;
            font-size: 12.5px;
            color: var(--text-muted);
        }

        .chat-header .status span:last-child {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--ok);
            box-shadow: 0 0 0 3px rgba(6, 118, 71, .15);
            flex: none;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            flex: none;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text-muted);
            cursor: pointer;
            transition: background .15s, color .15s, border-color .15s, transform .1s;
        }

        .icon-btn:hover {
            background: var(--surface-3);
            color: var(--text);
        }

        .icon-btn:active {
            transform: scale(.95);
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
        }

        :focus-visible {
            outline: none;
            box-shadow: var(--ring);
            border-radius: 8px;
        }

        /* ---------- Messages ---------- */
        .chat-messages {
            flex: 1;
            padding: 22px 20px 8px;
            overflow-y: auto;
            overscroll-behavior: contain;
            background: var(--surface-2);
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 99px;
            border: 3px solid var(--surface-2);
        }

        .message {
            display: flex;
            gap: 10px;
            max-width: 86%;
            animation: rise .28s ease both;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .message,
            .chat-messages {
                animation: none;
                scroll-behavior: auto;
            }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.ia {
            align-self: flex-start;
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            flex: none;
            display: grid;
            place-items: center;
            font-size: 12px;
            font-weight: 700;
            margin-top: 2px;
        }

        .message.ia .avatar {
            background: linear-gradient(135deg, var(--accent), var(--brand));
            color: #fff;
        }

        /* Tappy va suelto junto a su mensaje: sin círculo de fondo que lo encajone. */
        .message.ia .avatar.tappy {
            width: 38px;
            height: 38px;
            margin: -2px -4px 0 -4px;
            background: none;
            border-radius: 0;
        }

        .message.ia .avatar.tappy img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 2px 3px rgba(6, 20, 48, .28));
        }

        .message.user .avatar {
            background: var(--surface-3);
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .bubble {
            padding: 12px 15px;
            border-radius: 14px;
            line-height: 1.6;
            font-size: 14.5px;
            word-wrap: break-word;
            overflow-wrap: anywhere;
            box-shadow: var(--shadow-sm);
            min-width: 0;
        }

        .message.user .bubble {
            background: var(--bubble-user-bg);
            color: var(--bubble-user-text);
            border-bottom-right-radius: 4px;
        }

        .message.ia .bubble {
            background: var(--bubble-ia-bg);
            color: var(--bubble-ia-text);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .message.error .bubble {
            background: var(--danger-bg);
            border-color: var(--danger-border);
            color: var(--danger);
        }

        .message.error .avatar {
            background: var(--danger-bg);
            border: 1px solid var(--danger-border);
            color: var(--danger);
        }

        /* Aviso de límite de consultas: no es una falla, Tappy solo pide esperar. */
        .message.notice .bubble {
            background: var(--warn-bg);
            border-color: var(--warn-border);
            color: var(--warn);
        }

        .bubble .meta {
            display: block;
            margin-top: 8px;
            font-size: 11px;
            opacity: .65;
        }

        .bubble .inline-code {
            font-family: var(--mono);
            font-size: 12.5px;
            background: var(--surface-3);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 1px 5px;
        }

        .message.user .bubble .inline-code {
            background: rgba(255, 255, 255, .16);
            border-color: rgba(255, 255, 255, .22);
        }

        /* ---------- Code block ---------- */
        .code-block {
            margin-top: 12px;
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--code-border);
            background: var(--code-bg);
        }

        .code-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 7px 10px 7px 12px;
            background: rgba(255, 255, 255, .05);
            border-bottom: 1px solid var(--code-border);
            color: #94a3b8;
            font-size: 11.5px;
            letter-spacing: .4px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .copy-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, .08);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 7px;
            padding: 4px 9px;
            font: inherit;
            font-size: 11.5px;
            text-transform: none;
            letter-spacing: 0;
            cursor: pointer;
            transition: background .15s, color .15s;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, .16);
            color: #fff;
        }

        .copy-btn.copied {
            color: #6ee7b7;
            border-color: rgba(110, 231, 183, .4);
        }

        .copy-btn svg {
            width: 13px;
            height: 13px;
        }

        .code-block pre {
            margin: 0;
            padding: 14px;
            overflow-x: auto;
            max-height: 380px;
            color: var(--code-text);
            font-family: var(--mono);
            font-size: 12.5px;
            line-height: 1.55;
            tab-size: 2;
        }

        /* ---------- Notes ---------- */
        .note {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            line-height: 1.5;
            background: var(--warn-bg);
            border: 1px solid var(--warn-border);
            color: var(--warn);
        }

        .note.ticket {
            background: rgba(6, 118, 71, .10);
            border-color: rgba(6, 118, 71, .35);
            color: var(--ok);
        }

        html[data-theme="dark"] .note.ticket {
            background: rgba(95, 211, 155, .10);
            border-color: rgba(95, 211, 155, .30);
        }

        /* ---------- Suggestions ---------- */
        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 4px 20px 12px;
            background: var(--surface-2);
        }

        .suggestions:empty {
            display: none;
        }

        .chip {
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-muted);
            border-radius: 999px;
            padding: 7px 13px;
            font: inherit;
            font-size: 13px;
            cursor: pointer;
            transition: border-color .15s, color .15s, transform .1s;
        }

        .chip:hover {
            border-color: var(--accent-strong);
            color: var(--text);
        }

        .chip:active {
            transform: scale(.97);
        }

        /* ---------- Typing ---------- */
        .typing-indicator {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 0 20px 10px;
            background: var(--surface-2);
            color: var(--text-muted);
            font-size: 13px;
        }

        .typing-indicator[data-visible="true"] {
            display: flex;
        }

        .typing-dots {
            display: inline-flex;
            gap: 4px;
        }

        .typing-dots i {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-strong);
            animation: blink 1.2s infinite ease-in-out;
        }

        .typing-dots i:nth-child(2) {
            animation-delay: .18s;
        }

        .typing-dots i:nth-child(3) {
            animation-delay: .36s;
        }

        @keyframes blink {

            0%,
            60%,
            100% {
                opacity: .25;
                transform: translateY(0);
            }

            30% {
                opacity: 1;
                transform: translateY(-3px);
            }
        }

        /* ---------- Composer ---------- */
        .chat-input {
            padding: 12px 16px 16px;
            background: var(--surface);
            border-top: 1px solid var(--border);
        }

        .composer {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            padding: 8px 8px 8px 14px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 16px;
            transition: border-color .15s, box-shadow .15s;
        }

        .composer:focus-within {
            border-color: var(--accent-strong);
            box-shadow: var(--ring);
        }

        .composer textarea {
            flex: 1;
            border: none;
            background: transparent;
            resize: none;
            color: var(--text);
            font-family: inherit;
            font-size: 14.5px;
            line-height: 1.55;
            padding: 8px 0;
            max-height: 168px;
            outline: none;
        }

        .composer textarea::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            flex: none;
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            color: var(--brand);
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: filter .15s, transform .1s, opacity .15s;
        }

        .send-btn svg {
            width: 19px;
            height: 19px;
        }

        .send-btn:hover:not(:disabled) {
            filter: brightness(1.08);
        }

        .send-btn:active:not(:disabled) {
            transform: scale(.94);
        }

        .send-btn:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        .composer-hint {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin: 8px 4px 0;
            font-size: 11.5px;
            color: var(--text-muted);
        }

        #charCount[data-cooldown="true"] {
            color: var(--warn);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        #charCount[data-over="true"] {
            color: var(--danger);
            font-weight: 600;
        }

        kbd {
            font-family: var(--font);
            font-size: 10.5px;
            border: 1px solid var(--border);
            border-bottom-width: 2px;
            border-radius: 5px;
            padding: 1px 5px;
            background: var(--surface-2);
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
            border: 0;
        }

        /* ---------- Modo embebido (drawer de la documentación) ---------- */
        html[data-embed="1"] body {
            padding: 0;
            background: var(--surface);
        }

        html[data-embed="1"] .chat-container {
            height: 100dvh;
            max-width: none;
            border: none;
            border-radius: 0;
            box-shadow: none;
        }

        html[data-embed="1"] .chat-container::before {
            display: none;
        }

        /* El drawer de la documentación ya muestra su propio título y controles. */
        html[data-embed="1"] .chat-header {
            display: none;
        }

        .icon-btn[hidden] {
            display: none;
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 720px) {
            body {
                padding: 0;
                align-items: stretch;
            }

            .chat-container {
                height: 100dvh;
                max-width: none;
                border-radius: 0;
                border: none;
            }

            .message {
                max-width: 94%;
            }

            .chat-messages {
                padding: 16px 12px 6px;
            }

            .suggestions,
            .typing-indicator {
                padding-left: 12px;
                padding-right: 12px;
            }

            .chat-input {
                padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
            }

            .composer-hint .hint-keys {
                display: none;
            }
        }

        @media (max-width: 430px) {
            .chat-header {
                gap: 10px;
                padding: 14px 14px;
            }

            .chat-header .logo {
                height: 28px;
            }

            .chat-header .status {
                display: none;
            }
        }
    </style>
</head>

<body>

    <script>
        (function () {
            'use strict';

            var WELCOME = '¡Hola! Soy **Tappy**, la Inteligencia Artificial de QPayPro. Pega aquí el JSON que falló o hazme cualquier pregunta sobre tu integración y te daré un diagnóstico rápido.';

            var SUGGESTIONS = [
                'Mi transacción devuelve error de autenticación',
                '¿Cómo genero el token para pagina alojada?',
                '¿Qué campos son obligatorios en la petición?'
            ];

            var STATUS_IDLE = 'Agente en línea · responde en segundos';

            // Mismos topes que resolver.php (TAPPY_MAX_*). El servidor es quien manda;
            // aquí solo se aplican antes para no gastar una petición que va a rebotar.
            var MAX_MESSAGE_CHARS = 10000;
            var MAX_HISTORY_CHARS = 40000;
            var MAX_HISTORY_TURNS = 20;

            var els = {
                messages: document.getElementById('chatMessages'),
                suggestions: document.getElementById('suggestions'),
                typing: document.getElementById('typingIndicator'),
                input: document.getElementById('msgInput'),
                send: document.getElementById('sendBtn'),
                reset: document.getElementById('resetBtn'),
                theme: document.getElementById('themeBtn'),
                themeIcon: document.getElementById('themeIcon'),
                charCount: document.getElementById('charCount'),
                status: document.getElementById('statusText')
            };

            var chatHistory = [];
            var busy = false;

            // Modo embebido: el chat vive dentro del drawer de la documentación.
            var params = new URLSearchParams(window.location.search);
            if (params.get('embed') === '1') {
                document.documentElement.dataset.embed = '1';
            }

            /* ---------------- utilidades ---------------- */

            function escapeHtml(value) {
                return String(value == null ? '' : value)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            // Formato ligero y seguro: escapamos primero y luego aplicamos **negrita**, `código` y saltos de línea.
            function formatText(value) {
                return escapeHtml(value)
                    .replace(/`([^`\n]+)`/g, '<span class="inline-code">$1</span>')
                    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
                    .replace(/\n/g, '<br>');
            }

            function timeNow() {
                return new Date().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
            }

            function normalizeCode(code) {
                if (code == null) return '';
                if (typeof code === 'object') return JSON.stringify(code, null, 4);
                var clean = String(code).replace(/^```[a-z]*\n?/i, '').replace(/\n?```$/i, '').trim();
                try {
                    // Si es JSON válido lo mostramos siempre con el mismo formato.
                    var parsed = JSON.parse(clean);
                    if (parsed && typeof parsed === 'object') return JSON.stringify(parsed, null, 4);
                } catch (e) { /* no es JSON: se muestra tal cual */ }
                return clean;
            }

            function isNearBottom() {
                var el = els.messages;
                return el.scrollHeight - el.scrollTop - el.clientHeight < 120;
            }

            function scrollToBottom() {
                els.messages.scrollTop = els.messages.scrollHeight;
            }

            /* ---------------- construcción de mensajes ---------------- */

            function makeCodeBlock(code) {
                var wrap = document.createElement('div');
                wrap.className = 'code-block';

                var head = document.createElement('div');
                head.className = 'code-head';
                head.appendChild(document.createTextNode('Código corregido'));

                var copy = document.createElement('button');
                copy.type = 'button';
                copy.className = 'copy-btn';
                copy.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg><span>Copiar</span>';
                copy.addEventListener('click', function () {
                    var label = copy.querySelector('span');
                    var done = function () {
                        copy.classList.add('copied');
                        label.textContent = '¡Copiado!';
                        setTimeout(function () {
                            copy.classList.remove('copied');
                            label.textContent = 'Copiar';
                        }, 1800);
                    };
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(code).then(done, function () { fallbackCopy(code); done(); });
                    } else {
                        fallbackCopy(code);
                        done();
                    }
                });
                head.appendChild(copy);

                var pre = document.createElement('pre');
                var codeEl = document.createElement('code');
                codeEl.textContent = code;
                pre.appendChild(codeEl);

                wrap.appendChild(head);
                wrap.appendChild(pre);
                return wrap;
            }

            function fallbackCopy(text) {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); } catch (e) { /* sin portapapeles disponible */ }
                document.body.removeChild(ta);
            }

            function makeNote(text, variant) {
                var note = document.createElement('div');
                note.className = 'note' + (variant ? ' ' + variant : '');
                note.innerHTML = '<span aria-hidden="true">' + (variant === 'ticket' ? '🎫' : '⚠️') + '</span>' +
                    '<span>' + formatText(text) + '</span>';
                return note;
            }

            function addMessage(role, content, opts) {
                opts = opts || {};
                var stick = isNearBottom();

                var row = document.createElement('div');
                row.className = 'message ' + (role === 'user' ? 'user' : 'ia') +
                    (opts.error ? ' error' : '') + (opts.notice ? ' notice' : '');

                var avatar = document.createElement('div');
                avatar.className = 'avatar';
                avatar.setAttribute('aria-hidden', 'true');
                if (role !== 'user' && !opts.error) {
                    // Los mensajes del agente los firma Tappy.
                    avatar.className = 'avatar tappy';
                    var tappy = document.createElement('img');
                    tappy.src = 'assets/tappy.png';
                    tappy.alt = '';
                    tappy.width = 38;
                    tappy.height = 38;
                    avatar.appendChild(tappy);
                } else {
                    avatar.textContent = role === 'user' ? 'Tú' : '!';
                }

                var bubble = document.createElement('div');
                bubble.className = 'bubble';

                if (role === 'user' || typeof content === 'string') {
                    var body = document.createElement('div');
                    body.innerHTML = formatText(content);
                    bubble.appendChild(body);
                } else {
                    // El backend adjunta el aviso de ticket al final del diagnóstico, tras dos saltos de línea.
                    var diagnostico = String(content.diagnostico || '');
                    var ticketNote = '';
                    var okMarker = diagnostico.indexOf('\n\n🎫');
                    var errMarker = diagnostico.indexOf('\n\n⚠️');
                    var cut = okMarker !== -1 ? okMarker : errMarker;
                    if (cut !== -1) {
                        ticketNote = diagnostico.slice(cut).trim().replace(/^(🎫|⚠️)\s*/, '');
                        diagnostico = diagnostico.slice(0, cut).trim();
                    }

                    var diag = document.createElement('div');
                    diag.innerHTML = formatText(diagnostico);
                    bubble.appendChild(diag);

                    var code = normalizeCode(content.codigo_corregido);
                    if (code) {
                        bubble.appendChild(makeCodeBlock(code));
                        bubble.appendChild(makeNote('Al pasar a producción recuerda colocar tu **public_key** en el campo `x_login`.'));
                    }

                    if (ticketNote) {
                        bubble.appendChild(makeNote(ticketNote, okMarker !== -1 ? 'ticket' : ''));
                    }
                }

                var meta = document.createElement('span');
                meta.className = 'meta';
                meta.textContent = timeNow();
                bubble.appendChild(meta);

                row.appendChild(avatar);
                row.appendChild(bubble);
                els.messages.appendChild(row);

                if (stick || role === 'user') scrollToBottom();
                return row;
            }

            /* ---------------- sugerencias ---------------- */

            function renderSuggestions() {
                els.suggestions.innerHTML = '';
                if (chatHistory.length > 0) return;
                SUGGESTIONS.forEach(function (text) {
                    var chip = document.createElement('button');
                    chip.type = 'button';
                    chip.className = 'chip';
                    chip.textContent = text;
                    chip.addEventListener('click', function () {
                        els.input.value = text;
                        autoGrow();
                        syncSendState();
                        els.input.focus();
                    });
                    els.suggestions.appendChild(chip);
                });
            }

            /* ---------------- composer ---------------- */

            function autoGrow() {
                // Con el campo vacío dejamos que `rows="1"` mande: medir scrollHeight antes de que
                // el layout se asiente devuelve alturas infladas.
                if (!els.input.value) {
                    els.input.style.height = '';
                    return;
                }
                els.input.style.height = 'auto';
                els.input.style.height = Math.min(els.input.scrollHeight, 168) + 'px';
            }

            function syncSendState() {
                var len = els.input.value.trim().length;
                var wait = cooldownLeft();
                var tooLong = len > MAX_MESSAGE_CHARS;
                els.send.disabled = busy || len === 0 || wait > 0 || tooLong;

                // La cuenta regresiva va en el pie del compositor y no en la cabecera:
                // dentro del panel de la documentación la cabecera está oculta.
                delete els.charCount.dataset.cooldown;
                delete els.charCount.dataset.over;
                if (wait > 0) {
                    els.charCount.dataset.cooldown = 'true';
                    els.charCount.textContent = 'Podrás enviar en ' + formatWait(wait);
                } else if (tooLong) {
                    els.charCount.dataset.over = 'true';
                    els.charCount.textContent = len.toLocaleString('es') + ' / ' +
                        MAX_MESSAGE_CHARS.toLocaleString('es') + ' caracteres · recorta el mensaje';
                } else if (len > MAX_MESSAGE_CHARS * 0.8) {
                    // Cerca del tope se muestra el máximo para que no sorprenda.
                    els.charCount.textContent = len.toLocaleString('es') + ' / ' +
                        MAX_MESSAGE_CHARS.toLocaleString('es') + ' caracteres';
                } else {
                    els.charCount.textContent = len > 0 ? len.toLocaleString('es') + ' caracteres' : '';
                }
            }

            /* ---------------- tamaño del historial ---------------- */

            // Solo el tramo más reciente de la conversación viaja al servidor. Sin esto, una
            // charla larga (con bloques de código en cada respuesta) acabaría superando el
            // tope de tamaño y el chat dejaría de responder a mitad de la sesión.
            function historyForRequest() {
                var kept = [];
                var chars = 0;
                for (var i = chatHistory.length - 1; i >= 0; i--) {
                    var len = chatHistory[i].parts[0].text.length;
                    if (kept.length >= MAX_HISTORY_TURNS || chars + len > MAX_HISTORY_CHARS) break;
                    chars += len;
                    kept.unshift(chatHistory[i]);
                }
                // Gemini espera que la conversación empiece por el usuario.
                while (kept.length && kept[0].role !== 'user') kept.shift();
                return kept;
            }

            /* ---------------- límite de consultas ---------------- */

            var cooldownUntil = 0;
            var cooldownTimer = null;

            function cooldownLeft() {
                return Math.max(0, Math.ceil((cooldownUntil - Date.now()) / 1000));
            }

            function formatWait(seconds) {
                if (seconds < 60) return seconds + ' s';
                if (seconds < 3600) {
                    var m = Math.floor(seconds / 60);
                    var s = seconds % 60;
                    return m + ':' + (s < 10 ? '0' : '') + s;
                }
                // Se redondea a minutos antes de separar horas: si no, 86 399 s daría "23 h 60 min".
                var totalMin = Math.ceil(seconds / 60);
                var h = Math.floor(totalMin / 60);
                var min = totalMin % 60;
                return h + ' h' + (min ? ' ' + min + ' min' : '');
            }

            // Se puede seguir escribiendo durante la espera; solo se bloquea el envío.
            function startCooldown(seconds) {
                cooldownUntil = Date.now() + Math.max(1, seconds) * 1000;
                clearInterval(cooldownTimer);
                cooldownTimer = setInterval(function () {
                    syncSendState();
                    if (cooldownLeft() === 0) {
                        clearInterval(cooldownTimer);
                        cooldownTimer = null;
                    }
                }, 1000);
                syncSendState();
            }

            function setBusy(value) {
                busy = value;
                els.typing.dataset.visible = value ? 'true' : 'false';
                els.input.disabled = value;
                els.status.textContent = value ? 'Analizando tu consulta…' : STATUS_IDLE;
                syncSendState();
                if (value) scrollToBottom();
                else els.input.focus();
            }

            function resetChat() {
                chatHistory = [];
                els.messages.innerHTML = '';
                addMessage('ia', WELCOME);
                renderSuggestions();
                els.input.value = '';
                autoGrow();
                syncSendState();
                els.input.focus();
            }

            /* ---------------- envío ---------------- */

            function sendMessage() {
                var text = els.input.value.trim();
                if (!text || busy || cooldownLeft() > 0) return;

                var userRow = addMessage('user', text);
                els.input.value = '';
                autoGrow();

                chatHistory.push({ role: 'user', parts: [{ text: text }] });
                renderSuggestions();
                setBusy(true);

                fetch('resolver.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ history: historyForRequest() })
                }).then(function (response) {
                    return response.text();
                }).then(function (rawText) {
                    var data;
                    try {
                        data = JSON.parse(rawText);
                    } catch (e) {
                        throw new Error('Respuesta no válida del servidor: ' + rawText);
                    }

                    if (data.too_large) {
                        // Igual que con el límite de consultas: no se procesó, así que el
                        // texto vuelve al compositor para recortarlo en vez de perderse.
                        chatHistory.pop();
                        userRow.remove();
                        els.input.value = text;
                        addMessage('ia', data.error, { notice: true });
                        autoGrow();
                    } else if (data.rate_limited) {
                        // La consulta no se procesó: se retira del chat y el texto vuelve
                        // al compositor para reenviarlo sin reescribirlo cuando termine la espera.
                        chatHistory.pop();
                        userRow.remove();
                        els.input.value = text;
                        addMessage('ia', data.error, { notice: true });
                        autoGrow();
                        startCooldown(parseInt(data.retry_after, 10) || 60);
                    } else if (data.error) {
                        addMessage('ia', data.error, { error: true });
                        chatHistory.pop();
                    } else if (data.success) {
                        addMessage('ia', data.reply);
                        var iaTextResponse = 'Diagnóstico: ' + data.reply.diagnostico +
                            '\n\nCódigo:\n```json\n' + (data.reply.codigo_corregido || '') + '\n```';
                        chatHistory.push({ role: 'model', parts: [{ text: iaTextResponse }] });
                    } else {
                        addMessage('ia', 'No se recibió una respuesta válida del servidor.', { error: true });
                        chatHistory.pop();
                    }
                }).catch(function (error) {
                    addMessage('ia', error.message, { error: true });
                    chatHistory.pop();
                }).then(function () {
                    setBusy(false);
                });
            }

            /* ---------------- tema ---------------- */

            function applyTheme(theme) {
                document.documentElement.dataset.theme = theme;
                els.themeIcon.innerHTML = theme === 'dark'
                    ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
                    : '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
                els.theme.setAttribute('aria-label', theme === 'dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro');
                try { localStorage.setItem('qpay-theme', theme); } catch (e) { /* almacenamiento no disponible */ }
            }

            var storedTheme = null;
            try { storedTheme = localStorage.getItem('qpay-theme'); } catch (e) { /* almacenamiento no disponible */ }
            applyTheme(storedTheme || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

            // Embebido: el tema lo manda la documentación que nos contiene.
            if (document.documentElement.dataset.embed === '1') {
                els.theme.hidden = true;
                window.addEventListener('message', function (event) {
                    if (event.source !== window.parent) return;
                    var data = event.data;
                    if (!data) return;
                    if (data.type === 'qpay-theme' && (data.theme === 'dark' || data.theme === 'light')) {
                        applyTheme(data.theme);
                    } else if (data.type === 'qpay-reset') {
                        resetChat();
                    }
                });
            }

            /* ---------------- eventos ---------------- */

            els.send.addEventListener('click', sendMessage);
            els.reset.addEventListener('click', resetChat);
            els.theme.addEventListener('click', function () {
                applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
            });
            els.input.addEventListener('input', function () {
                autoGrow();
                syncSendState();
            });
            els.input.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            resetChat();
        })();
    </script>
</body>

</html>
