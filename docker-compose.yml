services:
  web:
    # Se construye desde el Dockerfile para heredar AllowOverride All
    # (necesario para que .htaccess proteja .env y docs_versions/).
    build: .
    container_name: qpayai_web
    # Puedes comentar o eliminar los puertos si NO quieres acceso directo por IP.
    # Cloudflare Tunnel se conectará internamente al puerto 80 del contenedor.
    ports:
      - "8001:80"
    volumes:
      # Montaje en vivo: los cambios que guarda el panel admin persisten en el host.
      - ./:/var/www/html
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
